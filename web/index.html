<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Theme first, before anything paints. A returning dark-theme user who sees
      a white frame has already been told the app is slow, whatever the numbers
      say. Mirrors apply() in src/lib/theme.svelte.ts exactly, so the module
      re-stamping the same values later is a no-op.
    -->
    <script>
      ;(function () {
        var choice
        try {
          choice = localStorage.getItem('colloq.theme.v1')
        } catch (error) {
          // Private browsing throws on read, not just on write.
        }
        if (choice !== 'light' && choice !== 'dark') {
          choice =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = choice
        root.classList.toggle('dark', choice === 'dark')
        root.style.colorScheme = choice
      })()
    </script>

    <title>Colloq</title>
    <!-- The brand grid, identical to gridFaviconHref(null) in src/lib/logo.ts, so
         the per-seminar mark the app swaps in later replaces like with like. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%230F2D69%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E" />

    <!--
      800 and 900 are here for the mastheads. The design is drawn in HSE Sans,
      which is licensed to the university and cannot be redistributed, so it
      leads every stack and Inter stands in — but Inter at 700 reads thin where
      the artboards are black, and the seminar name is the loudest thing on two
      screens. An instance that has HSE Sans installed gets it for free.

      Webfonts never block the first frame: the stylesheet is fetched at print
      priority and promoted once it lands, and every stack below degrades to a
      system face, so text is readable from the first paint rather than blank.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      />
    </noscript>

    <!--
      The app shell. Everything needed to paint the right ground colour and a
      calm working state is here, so the first frame costs zero requests; the
      app stylesheet (deferred in vite.config.ts) and the bundle land behind it.
      Tokens are namespaced --boot-* on purpose: these four values are a copy of
      index.css's, not a second definition of the palette.
    -->
    <style>
      :root {
        --boot-canvas: #ffffff;
        --boot-ink: #101a33;
        --boot-line: #dce3ef;
        --boot-accent: #0fa0d7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-canvas: #060c1c;
          --boot-ink: #e6e7e8;
          --boot-line: #16244b;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --boot-canvas: #060c1c;
        --boot-ink: #e6e7e8;
        --boot-line: #16244b;
        color-scheme: dark;
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--boot-canvas);
        color: var(--boot-ink);
        font-family:
          'HSE Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-canvas);
        transition: opacity 0.1s ease;
      }
      /* The app is live underneath while the shell fades, so it must not eat clicks. */
      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }

      /* A boot that finishes inside a quarter second should show a ground
         colour and nothing else — a spinner that flashes reads as a stutter. */
      #boot > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 0;
        animation: boot-in 0.25s ease 0.25s forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }

      /* The same mark the first screen draws, at the same weights. */
      #boot svg {
        display: block;
        width: 28px;
        height: 28px;
        color: var(--boot-ink);
      }
      #boot svg rect:nth-child(even) {
        opacity: 0.42;
      }

      #boot span {
        display: block;
        position: relative;
        overflow: hidden;
        width: 88px;
        height: 2px;
        margin: 0;
        border-radius: 999px;
        background: var(--boot-line);
      }
      #boot span::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-accent);
        transform: translateX(-100%);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot > div {
          animation-delay: 0s;
        }
        #boot span::after {
          width: 100%;
          transform: none;
          animation: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-label="Loading Colloq">
      <div>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="1.6" /><rect x="9" y="2" width="6" height="6" rx="1.6" />
          <rect x="16" y="2" width="6" height="6" rx="1.6" /><rect x="2" y="9" width="6" height="6" rx="1.6" />
          <rect x="9" y="9" width="6" height="6" rx="1.6" /><rect x="16" y="9" width="6" height="6" rx="1.6" />
          <rect x="2" y="16" width="6" height="6" rx="1.6" /><rect x="9" y="16" width="6" height="6" rx="1.6" />
          <rect x="16" y="16" width="6" height="6" rx="1.6" />
        </svg>
        <span></span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
