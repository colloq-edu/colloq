<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — for the console's sake, and here it is not cosmetic.

      Without it `env(safe-area-inset-*)` returns ZERO everywhere, even where
      the notch and the home indicator really are: the page simply does not
      claim the area under them, and the system has nothing to report. The
      console presses its rails against the very edges of the tablet — with
      zeros all its insets under the notch would silently not work, and the
      "Pointer" would end up under the home indicator, which intercepts the
      swipe.

      `user-scalable=no` and `maximum-scale` are NOT added on purpose: iOS
      Safari has ignored them since iOS 10 (so they cannot fix anything), while
      they do real harm to the accessibility of the rest of the app. Zoom on the
      console is suppressed where that works — with `touch-action` and WebKit's
      `gesture*` events, for the duration of the lecture.

      Neither `apple-mobile-web-app-capable` nor a manifest with `standalone` —
      also on purpose: a home-screen web app on iOS has ITS OWN storage, not
      shared with Safari, while the identity and the token live in
      localStorage. The icon would open as a new participant without presenter
      rights — that is, as a console that controls nothing.

      And the console's full screen is NOT an argument for standalone, although
      it seems to be one. The Safari bar is hidden by
      `Element.requestFullscreen` (iPadOS since 16.4), which the console
      requests from a live touch — the cradle screen "Tap to take the console"
      and the "Fullscreen ▸" bar exist exactly for this gesture; without it the
      browser refuses silently. And what full screen does not hide — the home
      indicator, notifications, the swipe from the edge — standalone would not
      hide either: only Guided Access can do that (a triple press of the top
      button), and the help about it lives in the "More" sheet. Standalone would
      thus give nothing and take away rights. The console accounts for the area
      under the notch and the indicator itself — `env(safe-area-inset-*)` from
      `viewport-fit=cover` above.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Theme first, before anything paints. A returning dark-theme user who sees
      a white frame has already been told the app is slow, whatever the numbers
      say. Mirrors apply() in src/lib/theme.svelte.ts exactly, so the module
      re-stamping the same values later is a no-op.
    -->
    <script>
      ;(function () {
        var choice
        try {
          choice = localStorage.getItem('colloq.theme.v1')
        } catch (error) {
          // Private browsing throws on read, not just on write.
        }
        if (choice !== 'light' && choice !== 'dark') {
          choice =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = choice
        root.classList.toggle('dark', choice === 'dark')
        root.style.colorScheme = choice
      })()
    </script>

    <!--
      The console is always dark, and this must be known BEFORE the first frame.

      The theme above is chosen per person — saved or system — and for the room
      that is right. But the console is opened in a dark lecture hall, and most
      people's OS default is light: the first frame of /s/:id/pult is a white
      1180×820 slab in the teacher's hands, a flash in their face and in the
      front row's, and constricted pupils that a second later must look at a
      slide. A dark console is a decision about the hall, not a preference of
      the tablet's owner.

      The person's theme is not touched at all: the saved choice is not
      rewritten, and ConsoleView borrows the dark one for the time of the screen
      (borrowTheme) and gives it back as it was. What is set here is an ADDRESS
      MARKER, not a theme, and for three reasons:
        · a `data-theme` set from here would not live anyway — initTheme() in
          lib/theme.svelte.ts applies the saved choice as soon as the module
          arrives;
        · it is not only the first frame that flashes white: the shell leaves
          when the styles arrive, while the room screen is a separate chunk, and
          the seconds between them are drawn with light tokens;
        · the marker overrides both the shell ground below and the palette in
          index.css with one selector.

      It is removed on leaving the console ("Go to room" in the "More" sheet) —
      otherwise a light room would stay dark until a reload. There is no other
      way to learn about the transition: the router goes through
      `history.pushState`, and history has no event of its own for it — hence
      the wrapper. It calls the original and returns its own result, so for all
      the other screens it is as if it were not there.

      The key link /s/:id/t/<key> is the same address: the tablet is opened
      with it, and it reaches /pult by itself, on the second frame, so it would
      have time to flash on the first.
    -->
    <script>
      ;(function () {
        var PULT = /^\/s\/[A-Za-z0-9_-]{1,64}\/(?:pult|t\/)/
        var root = document.documentElement
        function ground() {
          if (PULT.test(location.pathname)) root.setAttribute('data-pult', '')
          else root.removeAttribute('data-pult')
        }
        ground()
        window.addEventListener('popstate', ground)
        ;['pushState', 'replaceState'].forEach(function (name) {
          var was = history[name]
          history[name] = function () {
            var out = was.apply(this, arguments)
            ground()
            return out
          }
        })
      })()
    </script>

    <title>Colloq</title>
    <!-- The brand grid, identical to gridFaviconHref(null) in src/lib/logo.ts, so
         the per-seminar mark the app swaps in later replaces like with like. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%230F2D69%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E" />

    <!--
      HSE Sans now ships with the instance instead of being hoped for.

      It used to lead every stack and stand or fall on whether the machine
      happened to have it: the artboards are drawn in it, so a teacher with the
      font installed saw the product as designed and everybody else saw Inter,
      which is a tenth wider and reads thin at 700 where the artboards are
      black. Nobody could see that from a university laptop.

      Four weights, subset to Cyrillic, Latin and typography — 70 KB for all of
      them, served by the instance itself. That matters more here than on a
      marketing page: this product's whole claim is that a seminar runs on your
      own hardware, and a room that needs Google to render its own headings is
      not that.

      Declared here rather than in the app stylesheet on purpose — that sheet is
      deferred (see vite.config.ts), and a font that starts loading after the
      bundle arrives swaps under the reader's eyes.
    -->
    <!--
      Two of the four weights are preloaded, and that is not half-heartedness.

      900 is the mark and the heading of the first screen, 400 is all the rest
      of the text on it: without it the first frame was set in a fallback font
      and reflowed when the real one arrived. Measured on loopback: 400 was
      requested 500 ms later than the entry script, because the browser learned
      about it only from the layout.

      600 and 700 are left to ordinary discovery on purpose. On the entry
      screen two labels use them, their swap does not move lines, and two extra
      20 KB downloads in the first wave are the same 40 KB taken away from the
      form's code.
    -->
    <link rel="preload" href="/fonts/hse-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/hse-sans-900.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      And the monospace is ours too, from this same server.

      JetBrains Mono is the face of the notebook, the terminal and every output,
      and until now it came from fonts.googleapis.com: the only external
      dependency in the whole product standing on the way to the first frame of
      a class. On a university network with no way out, and when Google is
      unavailable (Cloudflare and external CDNs have already been blocked from
      Russia), the notebook was drawn in Menlo, and that is not even the worst:
      font-display swaps the font on the fly, Menlo's metrics are different, and
      line breaks in cells jump while people read.

      The argument "not ours to subset" was simply wrong: JetBrains Mono is
      under SIL OFL 1.1 (the text is next to it, JetBrainsMono-OFL.txt), and it
      may be hosted and subset. One file per subset, variable in weight: 400,
      500 and 700 come from the same woff2, because it has a weight axis. Latin
      is preloaded — all code is set in it; Cyrillic and the rest are pulled in
      by unicode-range only if such letters are actually drawn.
    -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The app shell. Everything needed to paint the right ground colour and a
      calm working state is here, so the first frame costs zero requests; the
      app stylesheet (deferred in vite.config.ts) and the bundle land behind it.
      Tokens are namespaced --boot-* on purpose: these four values are a copy of
      index.css's, not a second definition of the palette.
    -->
    <style>
      :root {
        --boot-canvas: #ffffff;
        --boot-ink: #101a33;
        --boot-line: #dce3ef;
        --boot-accent: #0fa0d7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-canvas: #060c1c;
          --boot-ink: #e6e7e8;
          --boot-line: #16244b;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --boot-canvas: #060c1c;
        --boot-ink: #e6e7e8;
        --boot-line: #16244b;
        color-scheme: dark;
      }
      /*
       * The console is dark regardless of the theme (see the script above). It
       * comes last because it argues with both branches at once and must win
       * over either.
       *
       * The values are the same as the dark branch's, not the separate case
       * colour #0B1120 from the mockup: the product has no third palette, and
       * the shell ground and the app ground must match — otherwise, where the
       * shell disappears, a step in lightness shows where nothing happened.
       */
      :root[data-pult] {
        --boot-canvas: #060c1c;
        --boot-ink: #e6e7e8;
        --boot-line: #16244b;
        color-scheme: dark;
      }

      /*
       * The four weights the product actually sets. No 500: HSE Sans has no
       * Medium, and CSS font matching picks the nearest — SemiBold — on its
       * own. Declaring 500 with the 600 file would be lying to the browser
       * about what we have.
       *
       * swap, not block: text must be on screen from the first frame. A 15 KB
       * file swaps faster than a reader crosses the first line, and that is
       * cheaper than a blank screen in a room of twenty people.
       */
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-600.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-900.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      /*
       * JetBrains Mono, variable: one and the same typeface at 400, 500 and
       * 700.
       *
       * The subsets are the same ones Google cuts, and for the same reason: the
       * browser downloads a file only if the page really has letters from its
       * unicode-range. Cyrillic in the monospace is needed not in code but in
       * the text of cells and outputs, and there is no reason to wait for it at
       * the entrance.
       */
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-cyrillic.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-cyrillic-ext.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
      }

      /*
       * The fallback monospace — the one that stands in while the real one is
       * on its way.
       *
       * `font-display: swap` changes the font on the fly, and without this pair
       * lines jumped: in JetBrains Mono a line takes 1.32em and a glyph 0.6em,
       * in Menlo 1.164em and 0.602em, in Consolas 0.55em. The metric overrides
       * bring the system font to ours: a line lands in the same place, a code
       * column at the same width, and the swap stops being visible.
       *
       * There are two families, and their names are DIFFERENT. Consolas has its
       * own width override, and one number cannot cover both — and two rules
       * under one name would rest on something the spec does not promise: what
       * the browser does when the chosen face has none of its local() —
       * whether it tries the other faces of the same family or drops the
       * family entirely — is up to it. Lose this lottery on Windows, and there
       * would be no fallback there at all — on exactly the machine the first
       * rule was written for.
       *
       * Different names are the ordinary family fallback, which is promised:
       * Consolas was not found (Mac, Linux) — take the next one; none was found
       * — what remains is exactly what there was before this fix. The order and
       * the full stack are in web/src/index.css, --font-mono; here are only the
       * faces themselves.
       *
       * `local()` takes a FACE, not a family, and by the face name — full or
       * PostScript. Measured in Chrome on a Mac (the width of a line of 80
       * "M"s): 'Menlo' is not found at all — the Menlo family has no face with
       * that name, there are "Menlo Regular" and "Menlo-Regular"; 'Monaco' and
       * 'Courier New' are found, because there the family name and the name of
       * the regular face coincide. While there was only 'Menlo' here, on a Mac
       * there was no fallback at all — exactly the breakage these rules were
       * set up for. So every font lists all its spellings: an extra local()
       * costs nothing, one that is not found is simply skipped.
       */
      @font-face {
        font-family: 'JetBrains Mono Fallback Consolas';
        src: local('Consolas'), local('Consolas Regular');
        size-adjust: 109.13%;
        ascent-override: 93.47%;
        descent-override: 27.49%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'JetBrains Mono Fallback Menlo';
        src:
          local('Menlo-Regular'), local('Menlo Regular'), local('Menlo'),
          local('DejaVu Sans Mono'), local('DejaVuSansMono'), local('DejaVu Sans Mono Book'),
          local('Liberation Mono'), local('LiberationMono'), local('Liberation Mono Regular');
        size-adjust: 99.66%;
        ascent-override: 102.35%;
        descent-override: 30.1%;
        line-gap-override: 0%;
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--boot-canvas);
        color: var(--boot-ink);
        font-family:
          'HSE Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * THE SPLASH. Its twin in the app is web/src/components/ui/Splash.svelte
       * (size="screen"), and it lands exactly in its place when the shell
       * leaves: the same centre of the window, the same mark 28, the same bar
       * 88×2, the same gap 16 and the same timings. The numbers here and there
       * are a copy of each other, because the app's CSS has not arrived yet at
       * this moment (the sheet loads without blocking, vite.config.ts) and they
       * cannot have a common source. They are edited as a pair: touched here —
       * edit Splash.svelte, and vice versa.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-canvas);
        transition: opacity 0.1s ease;
      }
      /* The app is live underneath while the shell fades, so it must not eat clicks. */
      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }

      /* A boot that finishes inside a quarter second should show a ground
         colour and nothing else — a spinner that flashes reads as a stutter. */
      #boot > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 0;
        animation: boot-in 0.25s ease 0.25s forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }

      /* The same mark the first screen draws, at the same weights — the nine
         squares from the icon set (web/src/components/ui/Icon.svelte · logo),
         repeated here by hand: the set arrives with the app, while this mark
         is drawn before it. */
      #boot svg {
        display: block;
        width: 28px;
        height: 28px;
        color: var(--boot-ink);
      }
      #boot svg rect:nth-child(even) {
        opacity: 0.42;
      }

      #boot span {
        display: block;
        position: relative;
        overflow: hidden;
        width: 88px;
        height: 2px;
        margin: 0;
        border-radius: 999px;
        background: var(--boot-line);
      }
      #boot span::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-accent);
        transform: translateX(-100%);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot > div {
          animation-delay: 0s;
        }
        #boot span::after {
          width: 100%;
          transform: none;
          animation: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot" role="status" aria-label="Загрузка Colloq">
      <div>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="1.6" /><rect x="9" y="2" width="6" height="6" rx="1.6" />
          <rect x="16" y="2" width="6" height="6" rx="1.6" /><rect x="2" y="9" width="6" height="6" rx="1.6" />
          <rect x="9" y="9" width="6" height="6" rx="1.6" /><rect x="16" y="9" width="6" height="6" rx="1.6" />
          <rect x="2" y="16" width="6" height="6" rx="1.6" /><rect x="9" y="16" width="6" height="6" rx="1.6" />
          <rect x="16" y="16" width="6" height="6" rx="1.6" />
        </svg>
        <span></span>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
