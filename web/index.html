<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — ради пульта, и он здесь не косметика.

      Без него `env(safe-area-inset-*)` возвращает НОЛЬ везде, даже там, где
      вырез и домашний индикатор есть на самом деле: страница просто не
      претендует на площадь под ними, и системе нечего сообщать. Пульт прижимает
      рейлы к самым кромкам планшета — с нулями все его отступы под вырезом
      молча не работали бы, и «Указка» оказалась бы под домашним индикатором,
      который перехватывает свайп.

      `user-scalable=no` и `maximum-scale` НЕ добавлены намеренно: iOS Safari
      игнорирует их с iOS 10 (то есть починить ими ничего нельзя), а
      доступности остального приложения они вредят по-настоящему. Зум на пульте
      гасится там, где это работает, — `touch-action` и вебкитовскими
      `gesture*`, на время лекции.

      Ни `apple-mobile-web-app-capable`, ни манифеста со `standalone` — тоже
      намеренно: у веб-приложения с домашнего экрана на iOS СВОЁ хранилище, не
      общее с Safari, а личность и токен лежат в localStorage. Иконка
      открывалась бы новым участником без прав ведущего — то есть пультом,
      который ничем не управляет.

      И полный экран пульта — НЕ довод в пользу standalone, хотя кажется им.
      Полосу Safari прячет `Element.requestFullscreen` (iPadOS с 16.4),
      который пульт просит из живого касания — экран-ложе «Коснитесь, чтобы
      взять пульт» и полоса «Во весь экран ▸» существуют ровно ради этого
      жеста, без него браузер отказывает молча. А то, чего полный экран не
      прячет — домашний индикатор, уведомления, свайп от кромки, — standalone
      не спрятал бы тоже: это умеет только Гид-доступ (тройное нажатие на
      верхнюю кнопку), и справка про него лежит в листе «Ещё». Standalone дал
      бы, таким образом, ничего, а отнял бы права. Площадь под вырезом и
      индикатором пульт учитывает сам — `env(safe-area-inset-*)` из
      `viewport-fit=cover` выше.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Theme first, before anything paints. A returning dark-theme user who sees
      a white frame has already been told the app is slow, whatever the numbers
      say. Mirrors apply() in src/lib/theme.svelte.ts exactly, so the module
      re-stamping the same values later is a no-op.
    -->
    <script>
      ;(function () {
        var choice
        try {
          choice = localStorage.getItem('colloq.theme.v1')
        } catch (error) {
          // Private browsing throws on read, not just on write.
        }
        if (choice !== 'light' && choice !== 'dark') {
          choice =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = choice
        root.classList.toggle('dark', choice === 'dark')
        root.style.colorScheme = choice
      })()
    </script>

    <!--
      Пульт всегда ночной, и знать об этом надо ДО первого кадра.

      Тема выше выбрана по человеку — сохранённой или системной, — и для комнаты
      это верно. Но пульт открывают в тёмной аудитории, а умолчание ОС у
      большинства светлое: первый кадр /s/:id/pult — белая плита 1180×820 в
      руках у преподавателя, вспышка ему в лицо и первому ряду, и посаженный
      зрачок, которому через секунду смотреть на слайд. Тёмный пульт — решение
      о зале, а не предпочтение владельца планшета.

      Тема человека при этом не трогается вовсе: сохранённый выбор не
      переписывается, а ConsoleView одалживает тёмную на время экрана
      (borrowTheme) и возвращает как было. Здесь ставится ПРИЗНАК АДРЕСА, а не
      тема, и по трём причинам:
        · `data-theme`, выставленный отсюда, всё равно не живёт — initTheme() в
          lib/theme.svelte.ts применит сохранённый выбор, как только приедет
          модуль;
        · белым мигает не только первый кадр: оболочка уходит по приходу стилей,
          а экран комнаты — отдельный кусок, и секунды между ними рисуются
          светлыми токенами;
        · признак перекрывает и грунт оболочки ниже, и палитру в index.css одним
          селектором.

      Снимается он на выходе с пульта («В комнату» в листе «Ещё») — иначе
      светлая комната осталась бы тёмной до перезагрузки. Другого способа узнать
      про переход нет: маршрутизатор ходит `history.pushState`, а своего события
      у неё нет — отсюда обёртка. Она зовёт исходную и отдаёт её же ответ, так
      что для всех остальных экранов её как будто и нет.

      Ссылка-ключ /s/:id/t/<key> — тот же адрес: планшет открывают ей, а на
      /pult он попадает уже сам, вторым кадром, и мигнуть успеет на первом.
    -->
    <script>
      ;(function () {
        var PULT = /^\/s\/[A-Za-z0-9_-]{1,64}\/(?:pult|t\/)/
        var root = document.documentElement
        function ground() {
          if (PULT.test(location.pathname)) root.setAttribute('data-pult', '')
          else root.removeAttribute('data-pult')
        }
        ground()
        window.addEventListener('popstate', ground)
        ;['pushState', 'replaceState'].forEach(function (name) {
          var was = history[name]
          history[name] = function () {
            var out = was.apply(this, arguments)
            ground()
            return out
          }
        })
      })()
    </script>

    <title>Colloq</title>
    <!-- The brand grid, identical to gridFaviconHref(null) in src/lib/logo.ts, so
         the per-seminar mark the app swaps in later replaces like with like. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%230F2D69%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%222%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%222%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%232E4E8C%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%226%22%20height%3D%226%22%20rx%3D%221.6%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E" />

    <!--
      HSE Sans now ships with the instance instead of being hoped for.

      It used to lead every stack and stand or fall on whether the machine
      happened to have it: the artboards are drawn in it, so a teacher with the
      font installed saw the product as designed and everybody else saw Inter,
      which is a tenth wider and reads thin at 700 where the artboards are
      black. Nobody could see that from a university laptop.

      Four weights, subset to Cyrillic, Latin and typography — 70 KB for all of
      them, served by the instance itself. That matters more here than on a
      marketing page: this product's whole claim is that a seminar runs on your
      own hardware, and a room that needs Google to render its own headings is
      not that.

      Declared here rather than in the app stylesheet on purpose — that sheet is
      deferred (see vite.config.ts), and a font that starts loading after the
      bundle arrives swaps under the reader's eyes.
    -->
    <link rel="preload" href="/fonts/hse-sans-900.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      И моноширинный — тоже наш, с этого же сервера.

      JetBrains Mono — лицо тетради, терминала и каждого вывода, и до сих пор
      оно приезжало с fonts.googleapis.com: единственная внешняя зависимость во
      всём продукте, стоящая на пути к первому кадру пары. В университетской
      сети без выхода наружу и при недоступности Google (а Cloudflare и внешние
      CDN из РФ уже блокировались) тетрадь рисовалась в Menlo, и это ещё не
      худшее: font-display заменяет шрифт на лету, метрики у Menlo другие, и
      переносы в ячейках перескакивают под чтение.

      Довод «не наш, чтобы сабсетить» был просто неверен: JetBrains Mono лежит
      под SIL OFL 1.1 (текст рядом, JetBrainsMono-OFL.txt), и хостить и резать
      его можно. Один файл на подмножество, вариативный по начертанию: 400, 500
      и 700 берутся из одного и того же woff2, потому что у него ось веса.
      Латиница предзагружается — на ней набран весь код; кириллица и остальное
      подтягиваются по unicode-range, только если такие буквы правда рисуют.
    -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The app shell. Everything needed to paint the right ground colour and a
      calm working state is here, so the first frame costs zero requests; the
      app stylesheet (deferred in vite.config.ts) and the bundle land behind it.
      Tokens are namespaced --boot-* on purpose: these four values are a copy of
      index.css's, not a second definition of the palette.
    -->
    <style>
      :root {
        --boot-canvas: #ffffff;
        --boot-ink: #101a33;
        --boot-line: #dce3ef;
        --boot-accent: #0fa0d7;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --boot-canvas: #060c1c;
          --boot-ink: #e6e7e8;
          --boot-line: #16244b;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --boot-canvas: #060c1c;
        --boot-ink: #e6e7e8;
        --boot-line: #16244b;
        color-scheme: dark;
      }
      /*
       * Пульт — ночной независимо от темы (см. скрипт выше). Стоит последним,
       * потому что спорит с обеими ветками разом и обязан выиграть у любой.
       *
       * Значения — те же, что у тёмной ветки, а не отдельный корпусный #0B1120
       * из чертежа: третьей палитры в продукте нет, а грунт оболочки и грунт
       * приложения обязаны совпадать — иначе на месте исчезающей оболочки
       * видно ступеньку светлоты там, где ничего не происходило.
       */
      :root[data-pult] {
        --boot-canvas: #060c1c;
        --boot-ink: #e6e7e8;
        --boot-line: #16244b;
        color-scheme: dark;
      }

      /*
       * The four weights the product actually sets. No 500: HSE Sans has no
       * Medium, and CSS font matching picks the nearest — SemiBold — on its
       * own. Declaring 500 with the 600 file would be lying to the browser
       * about what we have.
       *
       * swap, not block: text must be on screen from the first frame. A 15 KB
       * file swaps faster than a reader crosses the first line, and that is
       * cheaper than a blank screen in a room of twenty people.
       */
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-600.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'HSE Sans';
        src: url('/fonts/hse-sans-900.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }

      /*
       * JetBrains Mono, вариативная: одна и та же гарнитура на 400, 500 и 700.
       *
       * Подмножества — те же, что режет Google, и по той же причине: браузер
       * скачивает файл, только если на странице правда есть буквы из его
       * unicode-range. Кириллица в моноширинном нужна не в коде, а в тексте
       * ячеек и выводов, и ждать её на входе незачем.
       */
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-latin-ext.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-cyrillic.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/jetbrains-mono-cyrillic-ext.woff2') format('woff2');
        font-weight: 400 800;
        font-style: normal;
        font-display: swap;
        unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
      }

      /*
       * Подменный моноширинный — тот, что стоит, пока настоящий в пути.
       *
       * `font-display: swap` меняет шрифт на лету, и без этой пары строки
       * подпрыгивали: у JetBrains Mono строка занимает 1.32em и знак 0.6em, у
       * Menlo — 1.164em и 0.602em, у Consolas — 0.55em. Правки метрик приводят
       * системный шрифт к нашему: строка встаёт на то же место, колонка кода —
       * на ту же ширину, и подмена перестаёт быть видимой.
       *
       * Семейств два, и имена у них РАЗНЫЕ. Правка ширины у Consolas своя, и
       * одной цифрой их не накрыть, — а два правила под одним именем держались
       * бы на том, чего спецификация не обещает: что делает браузер, когда у
       * выбранного лица не нашлось ни одного local(), — переберёт ли остальные
       * лица той же семьи или бросит семью целиком — его дело. Проиграй эта
       * лотерея на Windows, и подмены там не было бы вовсе — ровно на той
       * машине, ради которой писано первое правило.
       *
       * Разные имена — обычный перебор семейств, который обещан: Consolas не
       * нашёлся (мак, Linux) — берём следующее; не нашлось ни одного —
       * остаётся ровно то, что было до этой правки. Порядок и полный стек — в
       * web/src/index.css, --font-mono; здесь только сами лица.
       *
       * `local()` берёт ЛИЦО, а не семью, и по имени лица — полному или
       * постскриптовому. Замерено в Chrome на маке (ширина строки из 80 «M»):
       * 'Menlo' не находится вообще — у семьи Menlo нет лица с таким именем,
       * есть «Menlo Regular» и «Menlo-Regular»; 'Monaco' и 'Courier New'
       * находятся, потому что там имя семьи и имя регулярного лица совпали.
       * Пока здесь стояло одно 'Menlo', на маке подмены не было вовсе — ровно
       * та поломка, ради которой эти правила и заводили. Поэтому у каждого
       * шрифта перечислены все написания: лишнее local() ничего не стоит,
       * ненайденное просто пропускается.
       */
      @font-face {
        font-family: 'JetBrains Mono Fallback Consolas';
        src: local('Consolas'), local('Consolas Regular');
        size-adjust: 109.13%;
        ascent-override: 93.47%;
        descent-override: 27.49%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'JetBrains Mono Fallback Menlo';
        src:
          local('Menlo-Regular'), local('Menlo Regular'), local('Menlo'),
          local('DejaVu Sans Mono'), local('DejaVuSansMono'), local('DejaVu Sans Mono Book'),
          local('Liberation Mono'), local('LiberationMono'), local('Liberation Mono Regular');
        size-adjust: 99.66%;
        ascent-override: 102.35%;
        descent-override: 30.1%;
        line-gap-override: 0%;
      }

      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--boot-canvas);
        color: var(--boot-ink);
        font-family:
          'HSE Sans', Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-canvas);
        transition: opacity 0.1s ease;
      }
      /* The app is live underneath while the shell fades, so it must not eat clicks. */
      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }

      /* A boot that finishes inside a quarter second should show a ground
         colour and nothing else — a spinner that flashes reads as a stutter. */
      #boot > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        opacity: 0;
        animation: boot-in 0.25s ease 0.25s forwards;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }

      /* The same mark the first screen draws, at the same weights. */
      #boot svg {
        display: block;
        width: 28px;
        height: 28px;
        color: var(--boot-ink);
      }
      #boot svg rect:nth-child(even) {
        opacity: 0.42;
      }

      #boot span {
        display: block;
        position: relative;
        overflow: hidden;
        width: 88px;
        height: 2px;
        margin: 0;
        border-radius: 999px;
        background: var(--boot-line);
      }
      #boot span::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--boot-accent);
        transform: translateX(-100%);
        animation: boot-sweep 1.1s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        to {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot > div {
          animation-delay: 0s;
        }
        #boot span::after {
          width: 100%;
          transform: none;
          animation: none;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
