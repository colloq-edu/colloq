services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      # PORT publishes the container's 3000 on the host; PUBLIC_URL is what goes
      # into the link students receive. Compose cannot derive one from the other
      # (it has no nested defaults), so change them together — .env.example
      # keeps them side by side for exactly this reason.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Empty on purpose. A literal default here would ship every install the
      # same signing key, and that key is what says who the host is. Left unset
      # the server generates one on first boot and keeps it in DATA_DIR, so a
      # restart does not sign the room out. Set it to rotate, or to share one
      # key across replicas.
      SESSION_SECRET: ${SESSION_SECRET:-}
      JUPYTER_URL: http://kernel:8888
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-colloq-dev-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # Compose reads .env for substitution only; a variable that is not named
      # here never reaches the container. Both of these are documented in
      # .env.example and in the README table, so both have to be forwarded or
      # the documentation is a lie.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      OPEN_SEMINAR_CREATION: ${OPEN_SEMINAR_CREATION:-false}
    volumes:
      # Bind-монты, а не именованные тома, и это существенно.
      #
      # `make up` и `make run` — два способа поднять один и тот же Colloq, и с
      # томами они поднимали два разных: у одного база и файлы лежали в томе
      # docker, у другого в ./data и ./workspace рядом с кодом. Разные семинары,
      # разные преподаватели, разные setup-token — при одинаковом адресе
      # localhost:3000. Неделя занятий, заведённая через `make up`, наутро
      # открывалась пустой панелью, а ссылки из расписания отвечали 404.
      #
      # Один каталог на оба режима: где данные лежат, теперь видно в файловом
      # менеджере, и скопировать их — это скопировать папку.
      - ./workspace:/workspace
      - ./data:/data
    depends_on:
      kernel:
        condition: service_healthy
    restart: unless-stopped

  kernel:
    build:
      context: ./kernel
      args:
        # Какое окружение запечено в образ. Списки лежат в kernel/environments/;
        # `make env-use NAME=cv` переписывает KERNEL_ENV в .env и пересобирает.
        KERNEL_ENV: ${KERNEL_ENV:-base}
    # Тег по имени окружения, чтобы переключение назад не пересобирало заново:
    # каждое окружение — свой образ, они лежат рядом и достаются из кеша.
    image: colloq-kernel:${KERNEL_ENV:-base}
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-colloq-dev-token}
    volumes:
      - ./workspace:/workspace
    # Student code is arbitrary. Keep a runaway cell from taking down the host.
    mem_limit: ${KERNEL_MEM:-2g}
    cpus: ${KERNEL_CPUS:-2}
    pids_limit: 512
    restart: unless-stopped
    expose:
      - "8888"

