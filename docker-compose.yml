# Explicit local Docker development. Production uses deploy/k3s.
# Each room gets its own kernel; missing Docker access or network fails execution.
name: colloq

networks:
  default:
    name: colloq
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    # Bind the host publication; the app listens on all container interfaces.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      KERNEL_BACKEND: docker
      UI_LANGUAGE: ${UI_LANGUAGE:-ru}
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      INSTITUTION: ${INSTITUTION:-}
      OPEN_SEMINAR_CREATION: ${OPEN_SEMINAR_CREATION:-false}
      MAX_SESSION_MB: ${MAX_SESSION_MB:-1024}
      COUNCIL_COPY_MB: ${COUNCIL_COPY_MB:-512}
      COUNCIL_MEMORY_GUARD: ${COUNCIL_MEMORY_GUARD:-1}
      AI_REASONING: ${AI_REASONING:-false}
      KERNEL_ENV: ${KERNEL_ENV:-base}
      KERNEL_ISOLATION: required
      # This path is resolved by the Docker daemon, not by the app container.
      WORKSPACE_HOST_DIR: ${WORKSPACE_HOST_DIR:-${PWD}/workspace}
      # The same trick for competition submissions: their throwaway containers
      # mount the competition's data and answers, and the daemon resolves those
      # paths on the host. Without this every submission gets an empty data
      # directory and fails on read_csv — silently, and for everyone at once.
      DATA_HOST_DIR: ${DATA_HOST_DIR:-${PWD}/data}
      KERNEL_NETWORK: ${KERNEL_NETWORK:-colloq}
      KERNEL_MEM: ${KERNEL_MEM:-4g}
      # Per-environment override, one line per environment that needs its own
      # ceiling: a deep-learning seminar wants 8-16g where a plain room wants 2g.
      KERNEL_MEM_BASE_GPU: ${KERNEL_MEM_BASE_GPU:-}
      KERNEL_CPUS: ${KERNEL_CPUS:-2}
      KERNEL_GPUS: ${KERNEL_GPUS:-}
      KERNEL_SHM: ${KERNEL_SHM:-1g}
      # The second container per class, the one holding students' personal
      # notebooks: how many kernels may live in it and how many processes it
      # may hold. It never receives a GPU slice.
      KERNEL_OWN_MAX: ${KERNEL_OWN_MAX:-40}
      KERNEL_OWN_PIDS: ${KERNEL_OWN_PIDS:-2048}
      KERNEL_OWN_IDLE_MIN: ${KERNEL_OWN_IDLE_MIN:-30}
      TZ: ${TZ:-Europe/Moscow}
    # Docker socket access is root-equivalent and is development-only.
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./workspace:/workspace
      - ./data:/data
      - ./kernel:/app/kernel
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
    restart: unless-stopped

  # Build target only; never an instance-wide execution service.
  kernel:
    profiles: [image-build]
    build:
      context: ./kernel
      args:
        KERNEL_ENV: ${KERNEL_ENV:-base}
        PARENT: ${KERNEL_PARENT:-python:3.11-slim-bookworm}
    image: colloq-kernel:${KERNEL_ENV:-base}
