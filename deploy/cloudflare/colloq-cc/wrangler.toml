# Описание воркера-зеркала colloq.cc.
#
# Файл лежит здесь не ради самого wrangler: выкладывает воркер соседний
# deploy.sh голым curl, потому что npx wrangler тянет из сети полсотни пакетов,
# а зеркало чинят обычно ровно тогда, когда с сетью и так плохо.
#
# Но единственным источником правды про имя, дату совместимости и маршруты
# остаётся этот файл: deploy.sh читает значения ОТСЮДА (sed по трём строкам),
# а не носит свою копию. Иначе правка маршрута в одном месте молча разъезжалась
# бы со вторым, и `wrangler deploy` с чужой машины возвращал бы зеркало к
# прежним настройкам.

name = "colloq-cc-mirror"
main = "worker.js"
compatibility_date = "2025-09-19"

# Воркер не должен получить ещё и адрес вида *.workers.dev: третья копия сайта
# для поисковика тут так же лишняя, как www.
workers_dev = false

# Оба имени зеркала ведут в воркер. www он тут же разворачивает на апекс — то
# есть маршрут www нужен именно для того, чтобы было кому ответить редиректом.
# zone_name, а не zone_id: идентификатор зоны ничего не говорит читателю.
[[routes]]
pattern = "colloq.cc/*"
zone_name = "colloq.cc"

[[routes]]
pattern = "www.colloq.cc/*"
zone_name = "colloq.cc"
