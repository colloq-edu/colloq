# The Colloq wheel: `pip install colloq`, and the machine has the `colloq`
# command.
#
# Inside the wheel lies the built application (colloq/_app): the server, the
# frontend, the CLI and the kernel Dockerfile. scripts/pack.mts puts it there,
# and it also writes colloq/_version.py. Python here is packaging and nothing
# more: all the class logic lives in the CLI, the shim only finds Node and
# hands control over to it.
#
#   make pack    build the application into colloq/_app
#   make wheel   build the wheel (pack runs by itself)
#
# The backend is hatchling: of the common ones, it is the only one that puts
# non-Python files into the wheel without a separate MANIFEST.in, and we have
# several thousand such files.

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "colloq"
dynamic = ["version"]
description = "Colloq — a shared workspace for teaching: one link, one live notebook, one assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aleksandr Kalashnikov" }]
keywords = ["jupyter", "notebook", "teaching", "seminar", "collaborative", "classroom", "education"]
# 3.9 is not a whim: it is the stock python3 in macOS 12–13 and in Debian 11.
# The shim asks for nothing beyond it, and requiring more would mean sending
# the teacher to install Python for a program that is not written in Python.
requires-python = ">=3.9"
# There are no dependencies and there will be none: everything the shim needs
# is in the standard library. The empty list is stated here out loud, so that
# it is a decision and not an oversight.
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: Jupyter",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Natural Language :: Russian",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Education :: Computer Aided Instruction (CAI)",
]

[project.scripts]
colloq = "colloq.__main__:main"

# PyPI shows these in the project sidebar, and they are the only way from the
# package page to the source, the tracker and the changelog: the wheel's README
# (python/README.md) says nothing about the repository.
[project.urls]
Homepage = "https://colloq.ru"
Documentation = "https://colloq.ru/docs/en/"
Source = "https://github.com/colloq-edu/colloq"
Issues = "https://github.com/colloq-edu/colloq/issues"
Changelog = "https://github.com/colloq-edu/colloq/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "colloq/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["colloq"]
# _app is built, not written, and so it is in .gitignore. By default Hatchling
# drops from the wheel everything git ignores, and the wheel would come out
# empty, with the shim alone and no application. `artifacts` is exactly the
# list of exceptions to that rule.
artifacts = ["colloq/_app/**"]

[tool.hatch.build.targets.sdist]
# The package source is the shim; the application is not put into it. There
# is nothing to build a wheel from an sdist with anyway: that takes the whole
# repository with npm and esbuild.
include = ["colloq/*.py", "pyproject.toml", "README.md"]
