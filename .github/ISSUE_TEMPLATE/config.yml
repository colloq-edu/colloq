# Blank issues stay enabled for the sake of questions: Discussions are turned
# off in the repository, and without a blank form a question would have
# nowhere to go.
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/colloq-edu/colloq/security/advisories/new
    about: Report privately. Never open a public issue for a vulnerability.
  - name: Documentation
    url: https://colloq.ru/docs/en/
    about: Guides for installing, teaching with and operating Colloq.
  - name: Troubleshooting
    url: https://colloq.ru/docs/en/troubleshooting.html
    about: Common problems and how to diagnose them before filing a bug.
