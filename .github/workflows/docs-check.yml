# The published documentation matches its sources.
#
# site/docs/** is the output of docs/build.py from docs/pages/**, and both are
# in the tree. pages.yml publishes site/ as is and builds nothing, so a source
# edited without a rebuild never reaches colloq.ru/docs at all: the PR shows
# the new article, the site shows the old one, and nobody notices the
# divergence until a reader finds it. A hand edit of the generated HTML is lost
# just as silently: the next person to rebuild wipes it. Here the build is
# repeated on a clean checkout, and any trace in site/docs, a changed or a new
# file, fails the check with a list of what diverged.
#
# Only the Python standard library (see the header of docs/build.py): neither
# npm nor pip, so the check is cheap, has no secrets and is safe for PRs from
# forks.
name: Docs up to date

on:
  pull_request:
    paths:
      - "docs/**"
      - "site/docs/**"
      - ".github/workflows/docs-check.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/docs/**"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the previous run: nobody needs the
# outcome for the old commit any more.
concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: site/docs matches docs/build.py
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The build has no use for the token in .git/config: after checkout
          # git does not go to the network.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the docs
        # build.py reads and writes text in the locale encoding (read_text()
        # without encoding), and the articles are Cyrillic. The runner has
        # C.UTF-8 now and everything works, but that is a property of the
        # image, not of the build: an image with another locale would crash
        # the build on the first Russian character or write the files in the
        # wrong encoding, and the check would blame an innocent PR.
        env:
          PYTHONUTF8: '1'
        run: python3 docs/build.py
      - name: Generated docs are committed
        # --porcelain, not git diff: a new article is an UNtracked file in
        # site/docs/en/, and git diff does not see it.
        run: |
          # sitemap.xml is written by the same build: a new article without a
          # line in the sitemap is a page a search engine finds only through a
          # link from the page next to it.
          changed="$(git status --porcelain -- site/docs site/sitemap.xml)"
          if [ -n "$changed" ]; then
            echo "::error::site/docs or site/sitemap.xml is out of date with docs/pages. Run 'python3 docs/build.py' and commit the regenerated files together with the sources."
            echo "$changed"
            git diff --stat -- site/docs site/sitemap.xml
            exit 1
          fi
          echo "site/docs matches docs/pages."
      - name: No Russian page without a source
        # An article was removed from docs/pages/ru, but its
        # site/docs/<slug>.html stayed in the tree and is still served on
        # colloq.ru/docs at the old address, from search and from other
        # people's links. The step above does not see this: build.py cleans up
        # orphaned pages only in en/ (the root of site/docs is shared with the
        # hand-written docs.css and docs.js, and the build deletes nothing
        # there), so after the rebuild the file is simply untouched and git
        # status is clean. An English orphan the build deletes itself, and the
        # check above catches it.
        run: |
          orphans=""
          for f in site/docs/*.html; do
            [ -e "docs/pages/ru/$(basename "$f")" ] || orphans="$orphans $f"
          done
          if [ -n "$orphans" ]; then
            echo "::error::These pages have no source in docs/pages/ru and would stay published. Delete them (git rm) together with the source:$orphans"
            exit 1
          fi
