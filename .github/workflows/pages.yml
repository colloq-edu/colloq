# colloq.ru: the landing page and the published seminars.
#
# The site lives in `site/` of this same repository, not in a separate one. The
# separate one was set up with the caveat "Pages cannot do private
# repositories", and that was untrue: Pages serves a public site from a
# repository of any visibility, so a second clone alongside is not needed,
# neither while the source is closed nor after.
#
# The directory can be arbitrary precisely because a workflow publishes it, not
# a branch: a build "from a branch" can only do the root and /docs, and the
# root here is taken by the product.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # Only when the site itself changes. Otherwise every kernel or notebook
    # edit would redeploy pages it has nothing to do with.
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: two at once would lay the files out jumbled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The token in .git/config is not needed further on: only find and
          # the upload of site/.
          persist-credentials: false
      - name: Nothing extra in the artifact
        # Seminar pages are built by `make site` and checked on that side;
        # this is the last checkpoint: site/ must contain no database, no room
        # working folders, no keys.
        #
        # No -maxdepth, and that is not a detail: publishing writes deeper than
        # the checkpoint used to look. `site/p/<handle>/index.html`,
        # `site/p/<handle>/<seq>/` and the images are depth 3–4, while the check
        # went down to 2, that is, it inspected exactly the level where
        # publishing puts nothing. The directory is small, a full walk costs
        # nothing.
        run: |
          set -e
          bad=$(find site \( -name '*.db' -o -name '*.sqlite*' -o -name '.env*' \
                -o -name 'setup-token' -o -name 'id_*' -o -name '*.pem' \
                -o -name '.ipynb_checkpoints' \) -print)
          if [ -n "$bad" ]; then
            echo "site/ contains what must not be there:"; echo "$bad"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
