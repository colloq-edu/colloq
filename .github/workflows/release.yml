# Неизменяемый выпуск для k3s: release.json с digest-ами образов приложения,
# брокера и окружений ядра плюс архив инструментов установки.
#
# Запускается руками для уже выпущенного тега: ему нужны проверенная версия
# k3s и версии GPU-обвязки, которых из тега не вывести. Тег, GitHub Release и
# его заметки создаёт release-please при слиянии PR выпуска, колесо, PyPI и
# образ vast.ai докладывает publish.yml; этот workflow дописывает свои файлы в
# тот же GitHub Release. Порядок — RELEASING.md.
name: Publish immutable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed git tag to publish
        required: true
      k3s_version:
        description: Exact tested k3s release (vX.Y.Z+k3sN)
        required: true
      environments:
        description: Comma-separated environment names
        default: base,cv,gpu
        required: true
      gpu_toolkit_version:
        description: Exact NVIDIA apt package version (required for GPU catalogs)
        required: false
      gpu_device_plugin_image:
        description: NVIDIA device-plugin registry image @sha256 digest (required for GPU catalogs)
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          # У этой задачи токен с правом записи в contents и packages, а
          # `npm ci` дальше исполняет install-скрипты зависимостей. git после
          # checkout в сеть не ходит (release-build.py делает git archive
          # локально), так что держать токен в .git/config незачем.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - name: Check tag, test and build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$VERSION"
          npm ci
          # Тег обязан быть версией из package.json этого коммита: иначе образы
          # :v0.2.0 содержали бы дерево, которое называет себя иначе.
          node --import tsx scripts/version.mts check --tag "$VERSION"
          npm test
          npm run typecheck
          npm run build:optimized
      - name: Refuse published version reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # GitHub Release по этому тегу создал release-please, колесо к нему
        # приложил publish.yml — это нормально. Выпуска нет — тег поставлен
        # мимо release-please, а заводить выпуск здесь значило бы писать его
        # заметки вторым писателем: отказ, и до сборки образов, а не после.
        # Неизменяемы файлы k3s: второй release.json — тоже отказ.
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md." >&2
            exit 1
          fi
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -qxF release.json; then
            echo "This version already has a k3s release manifest. Choose a new version." >&2
            exit 1
          fi
      # Вход в GHCR — после npm ci и тестов, а не до: иначе токен с правом
      # записи в пакеты лежал бы в ~/.docker/config.json, пока исполняются
      # install-скрипты зависимостей и вся сюита.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish digest-pinned images
        env:
          VERSION: ${{ inputs.version }}
          K3S_VERSION: ${{ inputs.k3s_version }}
          ENVIRONMENTS: ${{ inputs.environments }}
          REPOSITORY: ${{ github.repository }}
          GPU_TOOLKIT_VERSION: ${{ inputs.gpu_toolkit_version }}
          GPU_DEVICE_PLUGIN_IMAGE: ${{ inputs.gpu_device_plugin_image }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          python3 scripts/release-build.py --version "$VERSION" --k3s-version "$K3S_VERSION" \
            --registry "$prefix" --environments "$ENVIRONMENTS" --source-commit "$(git rev-parse HEAD)" \
            --gpu-toolkit-version "$GPU_TOOLKIT_VERSION" --gpu-device-plugin-image "$GPU_DEVICE_PLUGIN_IMAGE"
          python3 scripts/release.py validate --release release.json
          tar -czf colloq-deploy.tar.gz release.json scripts/cluster.sh scripts/release.py scripts/state-lock.py \
            scripts/backup.sh scripts/runtime-backup.py scripts/restore.sh scripts/host.sh scripts/lib.sh deploy/k3s
          sha256sum release.json colloq-deploy.tar.gz > SHA256SUMS
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # Выпуск есть (проверено до сборки); release.json сверяется ещё раз:
        # проверка выше была до долгой сборки, и отказ здесь дешевле, чем
        # полагаться на то, что между ними ничего не случилось.
        run: |
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -qxF release.json; then
            echo "Release already has k3s artifacts; publish a new version instead of replacing them." >&2
            exit 1
          fi
          # Без --clobber: существующий файл с тем же именем — отказ, а не замена.
          gh release upload "$VERSION" release.json colloq-deploy.tar.gz SHA256SUMS
