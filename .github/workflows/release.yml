# The immutable release for k3s: release.json with the image digests of the
# app, the broker and the kernel environments, plus an archive of the install
# tools.
#
# Started by hand for an already released tag: it needs a verified k3s version
# and versions of the GPU plumbing that cannot be derived from the tag. The
# tag, the GitHub Release and its notes are created by release-please when the
# release PR is merged; the wheel, PyPI and the vast.ai image are added by
# publish.yml; this workflow adds its own files to the same GitHub Release.
# The order of steps: RELEASING.md.
name: Publish immutable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed git tag to publish
        required: true
      k3s_version:
        description: Exact tested k3s release (vX.Y.Z+k3sN)
        required: true
      environments:
        description: Comma-separated environment names
        default: base,cv,gpu
        required: true
      gpu_toolkit_version:
        description: Exact NVIDIA apt package version (required for GPU catalogs)
        required: false
      gpu_device_plugin_image:
        description: NVIDIA device-plugin registry image @sha256 digest (required for GPU catalogs)
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          # This job has a token with write access to contents and packages,
          # and `npm ci` then runs the install scripts of the dependencies.
          # git does not go to the network after checkout (release-build.py
          # does git archive locally), so there is no reason to keep the token
          # in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - name: Check tag, test and build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$VERSION"
          npm ci
          # The tag must be the version from this commit's package.json:
          # otherwise the :v0.2.0 images would contain a tree that calls itself
          # something else.
          node --import tsx scripts/version.mts check --tag "$VERSION"
          npm test
          npm run typecheck
          npm run build:optimized
      - name: Refuse published version reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # The GitHub Release for this tag was created by release-please, and
        # publish.yml attached the wheel to it: that is normal. No release
        # means the tag was put past release-please, and creating the release
        # here would mean writing its notes as a second writer: refuse, and do
        # it before the image build, not after. The k3s files are immutable:
        # a second release.json is a refusal too.
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md." >&2
            exit 1
          fi
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -qxF release.json; then
            echo "This version already has a k3s release manifest. Choose a new version." >&2
            exit 1
          fi
      # The GHCR login comes after npm ci and the tests, not before: otherwise
      # a token with write access to packages would sit in
      # ~/.docker/config.json while the install scripts of the dependencies
      # and the whole suite run.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish digest-pinned images
        env:
          VERSION: ${{ inputs.version }}
          K3S_VERSION: ${{ inputs.k3s_version }}
          ENVIRONMENTS: ${{ inputs.environments }}
          REPOSITORY: ${{ github.repository }}
          GPU_TOOLKIT_VERSION: ${{ inputs.gpu_toolkit_version }}
          GPU_DEVICE_PLUGIN_IMAGE: ${{ inputs.gpu_device_plugin_image }}
        run: |
          prefix="ghcr.io/${REPOSITORY,,}"
          python3 scripts/release-build.py --version "$VERSION" --k3s-version "$K3S_VERSION" \
            --registry "$prefix" --environments "$ENVIRONMENTS" --source-commit "$(git rev-parse HEAD)" \
            --gpu-toolkit-version "$GPU_TOOLKIT_VERSION" --gpu-device-plugin-image "$GPU_DEVICE_PLUGIN_IMAGE"
          python3 scripts/release.py validate --release release.json
          tar -czf colloq-deploy.tar.gz release.json scripts/cluster.sh scripts/release.py scripts/state-lock.py \
            scripts/backup.sh scripts/runtime-backup.py scripts/restore.sh scripts/host.sh scripts/lib.sh deploy/k3s
          sha256sum release.json colloq-deploy.tar.gz > SHA256SUMS
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # The release exists (checked before the build); release.json is
        # checked once more: the check above came before the long build, and
        # refusing here is cheaper than relying on nothing having happened in
        # between.
        run: |
          if gh release view "$VERSION" --json assets --jq '.assets[].name' | grep -qxF release.json; then
            echo "Release already has k3s artifacts; publish a new version instead of replacing them." >&2
            exit 1
          fi
          # No --clobber: an existing file with the same name is a refusal,
          # not a replacement.
          gh release upload "$VERSION" release.json colloq-deploy.tar.gz SHA256SUMS
