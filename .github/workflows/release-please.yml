# Releases: release-please keeps a release PR, and merging that PR is the
# release.
#
#   release-please  on every push to main reads the Conventional Commits since
#                   the last tag and opens or updates the PR
#                   "chore(main): release X.Y.Z": the number in all copies
#                   (release-please-config.json, extra-files) and a
#                   CHANGELOG.md section. When that PR is merged, the same step
#                   puts the vX.Y.Z tag and creates a GitHub Release with the
#                   notes from the PR;
#   publish         only if the release was created in this run: starts
#                   publish.yml from that tag, which attaches the wheel to the
#                   release, with PyPI and GHCR behind variables.
#
# The token is the owner's personal token (the RELEASE_PLEASE_TOKEN secret),
# and without it the job fails instead of taking GITHUB_TOKEN. There are two
# reasons, both about things that cannot be seen with GITHUB_TOKEN until it is
# too late:
#   · a PR opened and updated by GITHUB_TOKEN does not start workflows (that is
#     how GitHub stops recursion): the release PR would have no CI, and it
#     would be merged blind;
#   · the commit in the release PR and the release itself would come from
#     github-actions[bot], while the owner wants to be the only author in the
#     history. With the owner's token the author and the committer is the
#     owner, without Co-Authored-By trailers.
#
# Why publish is started from here and not by the tag. A tag created with a
# personal token would also start `push: tags`, and there would be two paths to
# one publication, with two PyPI approval requests. Only one path is left:
# publish.yml has no tag trigger, only this start and a manual rerun.
#
# The release-please token goes only to the API: there is no checkout here,
# and neither npm nor anyone else's code runs next to the token. Details:
# RELEASING.md.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions are granted to jobs one by one; by default, none.
permissions: {}

# Runs go in turn and are never cancelled: a run cut off in the middle of
# creating a release would leave a tag without a release or a PR without the
# "autorelease: tagged" label.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and release
    # A fork has no secret and nothing to release: the job is not needed
    # there at all.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GITHUB_TOKEN is not needed for anything: release-please works with the
    # personal token.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: RELEASE_PLEASE_TOKEN is set
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          # The action's token input defaults to GITHUB_TOKEN. An empty secret
          # would give at best a vague "Input required", at worst a release PR
          # from the bot without CI. We check it ourselves and say what to do.
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret RELEASE_PLEASE_TOKEN is not set. Create a fine-grained personal access token for this repository only (Contents, Pull requests, Issues: read and write) and store it under that name. See RELEASING.md."
            exit 1
          fi
      # Pinned by commit, unlike the other actions in the repository: this is
      # the only third-party action that gets a personal token with write
      # access to main. A moved v4 tag would carry this token away.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summary
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          URL: ${{ steps.release.outputs.html_url }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          {
            if [ "$CREATED" = true ]; then
              echo "## Released $TAG"
              echo
              echo "$URL — the Publish job below attaches the wheel."
            else
              echo "## No release in this run"
              echo
              echo "Merging the release pull request, when one is open, cuts the next release."
            fi
            # pr is the JSON of the opened or updated release PR; it has no
            # link, only the number.
            number="$(printf '%s' "$PR" | jq -r '.number // empty' 2>/dev/null || true)"
            if [ -n "$number" ]; then
              echo
              echo "Release pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Start Publish from the tag
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Started, not called with `uses:`. PyPI Trusted Publishing does not
    # accept reusable workflows: for a called publish.yml the workflow_ref
    # stays release-please.yml, and PyPI refused the very first release
    # (v0.2.0) with `invalid-publisher`. publish.yml started from the tag is a
    # standalone run, and its claims match the publisher on PyPI.
    # workflow_dispatch is one of the few events GITHUB_TOKEN is allowed to
    # start.
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh workflow run publish.yml --ref "$TAG" -f tag="$TAG"
          echo "Publish for $TAG started: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish.yml" >> "$GITHUB_STEP_SUMMARY"
