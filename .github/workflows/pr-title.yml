# The PR title is a Conventional Commit.
#
# PRs are squash-merged, and the PR title becomes the subject of the commit in
# main. From these subjects release-please decides what the next number is and
# what goes into the CHANGELOG. A "Fix stuff" title release-please simply will
# not notice: the change lands in main and gets into neither the notes nor the
# version bump.
#
# A separate file, not a job in ci.yml: the title is changed by editing the PR
# (edited), and in ci.yml this event type would rerun the whole suite and the
# image builds, and its concurrency would also cancel a test run already in
# progress.
#
# No checkout, no token: the title comes from the event and is read only from
# an environment variable; in the script text it would be an injection from a
# fork's PR.
name: PR title

on:
  pull_request:
    # synchronize, even though a push does not change the title: a required
    # check is tied to the PR's latest commit, and without a run on it the
    # check would hang at "expected".
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The types are those release-please-config.json knows
          # (changelog-sections). The scope is optional; "!" marks a breaking
          # change. The release PR "chore(main): release 0.2.0" passes the
          # same way.
          types='feat|fix|perf|revert|docs|refactor|style|test|build|ci|chore'
          if printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ]"; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error::The pull request title must be a Conventional Commit, for example 'fix(council): keep the queue after a restart' or 'feat(cli)!: drop the vast command'. Allowed types: ${types//|/, }. It becomes the squash commit on main, which release-please reads (CONTRIBUTING.md)."
          echo "Got: $TITLE"
          exit 1
