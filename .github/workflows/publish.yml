# Publishes the vX.Y.Z release that release-please has already created. There
# is one entry point, workflow_dispatch with a tag, and two parties start it:
# release-please.yml right after the release (the usual path: the release PR
# was merged, and everything goes by itself) and a person, when missing parts
# have to be delivered for an existing tag.
#
# There is deliberately no `push: tags` trigger. release-please creates the
# tag with the owner's personal token, and such a tag does start workflows:
# with that trigger the release would be published twice, with two PyPI
# approval requests. Only one path is left.
#
#   build           tag = package.json = CHANGELOG (scripts/version.mts check),
#                   typecheck, the whole suite, and the pip wheels: the
#                   universal one and four platform wheels with Node inside
#                   (scripts/platform-wheels.py);
#   smoke           every platform wheel is installed into a clean venv and
#                   run on its own OS; if one does not run, there is no release;
#   github-release  the wheels and python-SHA256SUMS, attached to the release
#                   release-please created. The release itself is not created
#                   here: release-please writes its notes from the release PR,
#                   and a second writer would drift from it;
#   pypi            the wheels to PyPI, only when vars.PUBLISH_PYPI == 'true';
#   image           the server image to GHCR as colloq-vast and colloq-server
#                   (one build, one digest), only when vars.PUBLISH_IMAGES == 'true';
#   kernels         the room kernels for base and kaggle-base to GHCR as
#                   colloq-kernel:vX.Y.Z-<env>, under the same switch;
#   app-images      the app and the runtime broker for Kubernetes to GHCR as
#                   colloq-app:vX.Y.Z and colloq-runtime:vX.Y.Z (the root
#                   Dockerfile's targets production and broker), under the same
#                   switch;
#   chart           the Helm chart deploy/helm/colloq, its defaults set to this
#                   release (the digests of app-images and kernels, the kernel
#                   catalog, version = X.Y.Z), to oci://ghcr.io/<owner>/charts
#                   and to the GitHub Release with values-X.Y.Z.yaml, under the
#                   same switch.
#
# PyPI and GHCR are off until the owner turns them on with repository
# variables: nothing can be re-uploaded there, and the first release must not
# accidentally take the package name or the image tag. Steps and setup:
# RELEASING.md.
#
# The immutable release for k3s (release.json with the image digests) is the
# separate manual release.yml: it needs a verified k3s version and versions of
# the GPU plumbing that cannot be derived from the tag. It adds its files to
# the same GitHub Release, and takes the app, broker and kernel tags this
# workflow has published as they are (scripts/release-build.py · published).
#
# workflow_dispatch with a tag is a rerun for missing parts: for example,
# PUBLISH_PYPI was turned on after the release. What is already published is
# not overwritten: the wheel taken is the one attached to the release, an
# existing image tag is skipped (its digest is the one the chart gets), and an
# existing chart version is attached as it was pushed. Run it from the tag
# itself ("Use workflow from: vX.Y.Z"): see the verification step in build.
#
# Not workflow_call: called from release-please.yml, this file carried
# workflow_ref = release-please.yml in its OIDC token, and PyPI Trusted
# Publishing does not support reusable workflows. A standalone run from the
# tag keeps the way to it open, even while uploads go by token.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag vX.Y.Z to publish the missing parts of
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          # The token does not stay in .git/config during `npm ci` and the
          # tests: from here on git only reads the local history.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Tag, package.json and changelog agree
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The check comes before the tag is written anywhere: once it has
          # passed, the tag is guaranteed to look like vX.Y.Z[-rc.N] and is
          # safe in outputs.
          node --import tsx scripts/version.mts check --tag "$TAG"
          # The tag is on the commit under check, not a branch of that name.
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          # A tag is published by the workflow that lies in the tag itself. A
          # rerun from the tag ("Use workflow from: vX.Y.Z") guarantees that on
          # its own. The call from release-please.yml comes from main: this
          # file is taken from $GITHUB_SHA (for a called workflow that is the
          # caller's commit), and release-please puts the tag on the merge
          # commit of the release PR, usually the very same one. If in the
          # queue of runs the tag went to another commit of main, that one
          # will do too, as long as their .github is the same: the workflow is
          # then the same. Otherwise, as with a manual run from a branch, it
          # refuses: a different workflow would be doing the publishing.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" HEAD -- .github; then
              echo "::error::The workflows at $TAG differ from the ones running now. Run this workflow from the tag: gh workflow run publish.yml --ref $TAG -f tag=$TAG"
              exit 1
            fi
          fi
          version="$(node --import tsx scripts/version.mts current)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - name: Build the wheel (make wheel)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make wheel
      - name: The installed wheel names the tagged version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet python/dist/*.whl
          got="$(COLLOQ_HOME="$RUNNER_TEMP/colloq-home" NO_COLOR=1 "$RUNNER_TEMP/venv/bin/colloq" --version)"
          test "$got" = "$VERSION"
          git diff --exit-code
      # The Node archives are pinned by sha256 in scripts/node-runtime.json.
      # The cache only saves the download; the check runs regardless.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/colloq/node
          key: node-runtime-${{ hashFiles('scripts/node-runtime.json') }}
      - name: Platform wheels with Node inside
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 scripts/platform-wheels.py build
      - name: The Linux x64 wheel runs here without a Node of its own
        run: python3 scripts/platform-wheels.py smoke --wheel python/dist/*-manylinux_2_28_x86_64.whl
      - name: Release files
        run: |
          set -euo pipefail
          mkdir -p out
          cp python/dist/*.whl out/
          (cd out && sha256sum -- *.whl > python-SHA256SUMS)
          cat out/python-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  # A platform wheel that does not run on its own OS never reaches PyPI: a
  # version there cannot be replaced, only yanked. Linux x64 is already run in
  # build; here are the other three targets, each on its own runner.
  smoke:
    name: Platform wheel on ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15, tag: macosx_14_0_arm64 }
          - { target: darwin-x64, os: macos-15-intel, tag: macosx_14_0_x86_64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, tag: manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Install and run the wheel
        run: python3 scripts/platform-wheels.py smoke --wheel out/*-${{ matrix.tag }}.whl

  github-release:
    name: Attach the wheels to the GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Add the wheels to the release release-please created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The release is created by release-please when the release PR is
          # merged, and its notes come from there too. If it is missing, the
          # tag was put past release-please; creating the release here would
          # mean a second writer of notes, so refuse.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md."
            exit 1
          fi
          # release-please marks a prerelease only with prerelease: true, and
          # that would mark every 0.x as one too. So -rc.N is marked here:
          # otherwise GitHub would show an rc as "Latest".
          if [ "$PRERELEASE" = true ] && [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]; then
            gh release edit "$TAG" --prerelease
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          upload=()
          for file in out/*.whl out/python-SHA256SUMS; do
            grep -qxF "$(basename "$file")" <<<"$assets" || upload+=("$file")
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "::notice::$TAG already carries every wheel; they stay the files of record."
            exit 0
          fi
          # No --clobber: a file with the same name (for example, from
          # release.yml) is not overwritten; the upload fails instead.
          gh release upload "$TAG" "${upload[@]}"

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    # The PyPI API token is a secret of the `pypi` environment, not of the
    # repository: only this job sees it, and only after approval. An
    # environment with a required reviewer is the last button before what can
    # no longer be taken back. Trusted Publishing is postponed: it refused
    # v0.2.0 with `invalid-publisher`, and the first version was uploaded by
    # hand with this same token.
    environment:
      name: pypi
      url: https://pypi.org/project/colloq/
    permissions:
      contents: read
    steps:
      # The wheel is the one attached to the release, not a rebuilt one: PyPI
      # and the release page must carry the very same file.
      - name: Take the wheel attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.whl' --pattern python-SHA256SUMS --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c python-SHA256SUMS)
          # sha256sum -c says nothing about files missing from the list, so
          # every wheel has to be listed.
          for wheel in "$RUNNER_TEMP/release/"*.whl; do
            if ! grep -q "  $(basename "$wheel")\$" "$RUNNER_TEMP/release/python-SHA256SUMS"; then
              echo "::error::$(basename "$wheel") is not listed in python-SHA256SUMS"
              exit 1
            fi
          done
          mkdir -p dist
          cp "$RUNNER_TEMP/release/"*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version on PyPI cannot be re-uploaded; a rerun simply skips it.
          skip-existing: true
          print-hash: true

  image:
    name: vast.ai image to GHCR
    needs: build
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/vast/Dockerfile ]; then
            echo "::error::deploy/vast/Dockerfile is missing at this tag; nothing to publish"
            exit 1
          fi
          name="ghcr.io/${OWNER,,}/colloq-vast"
          # The same image under a name that says what it is off Vast: a
          # university's own server runs exactly this (colloq-host,
          # docs/pages/en/server.html). One build pushed under both names
          # keeps one digest, so neither can drift from the other.
          server="ghcr.io/${OWNER,,}/colloq-server"
          tags="$name:$VERSION,$server:$VERSION"
          # latest only for a release: an rc must not reach whoever put
          # "latest" into their vast template.
          if [ "$PRERELEASE" != true ]; then tags="$tags,$name:latest,$server:latest"; fi
          {
            echo "name=$name"
            echo "server=$server"
            echo "tags=$tags"
            # Baked into the image: where its entry point and colloq-host
            # bundle look for this version's kernels (the kernels job).
            echo "kernels=ghcr.io/${OWNER,,}/colloq-kernel"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Skip a version that is already published
        id: exists
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$NAME:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$NAME:$VERSION is already published; not rebuilding it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # A version published before the second name existed gets it without a
      # rebuild: the index (image and attestations alike) is copied, so both
      # names point at one digest. latest follows colloq-vast's latest and is
      # never moved ahead of it, or back.
      - name: Give an already published version its colloq-server name
        if: steps.exists.outputs.skip == 'true'
        env:
          NAME: ${{ steps.image.outputs.name }}
          SERVER: ${{ steps.image.outputs.server }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$NAME:$VERSION" --format '{{.Manifest.Digest}}')"
          if ! docker buildx imagetools inspect "$SERVER:$VERSION" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$SERVER:$VERSION" "$NAME@$digest"
          fi
          latest="$(docker buildx imagetools inspect "$NAME:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ "$PRERELEASE" != true ] && [ "$latest" = "$digest" ]; then
            docker buildx imagetools create -t "$SERVER:latest" "$NAME@$digest"
          fi
      # The OCI labels (version, revision, source, licenses) are written by
      # deploy/vast/Dockerfile itself from these arguments; they are not
      # duplicated here, so the image does not get two descriptions. The
      # revision is the tag's commit, not github.sha: on a manual rerun that
      # one points at the branch.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          file: deploy/vast/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            COLLOQ_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ needs.build.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            COLLOQ_KERNEL_REPO=${{ steps.image.outputs.kernels }}

  # The room kernels of the shipped CPU environments, so that a new server
  # pulls them instead of building them on first boot from the unpinned
  # kernel/requirements.txt, and an offline one can carry them in
  # (colloq-host bundle). The build is the one the entry point and the panel
  # run (deploy/vast/entrypoint.sh · prepare_kernels, environments.ts ·
  # buildCommand): kernel/Dockerfile with KERNEL_ENV, a child on its parent
  # (`# colloq: from`, here the parent just published, pinned by digest), the
  # root on the python its list names (`# colloq: python X.Y`; none leaves the
  # Dockerfile's own default). kernel/locks is not a build input there and is
  # not one here: it records a verified kaggle-base, and its check script is
  # run against the image before it is pushed. base-gpu stays out: nine
  # gigabytes of CUDA wheels on a runner's disk and in every pull, and a GPU
  # machine builds it once anyway. Each image carries its version and
  # environment as labels, by which the entry point knows a loaded image for
  # the published one.
  kernels:
    name: Kernel images to GHCR
    needs: build
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # {"base": "ghcr.io/<owner>/colloq-kernel@sha256:…", …}: what this job
    # pushed or found under the version's tags, for the chart's catalog.
    outputs:
      images: ${{ steps.pinned.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build, check and push the kernels
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          ENVIRONMENTS: base kaggle-base
        run: |
          # Plain bash, no bash-5 idioms: tests/vast-image.test.mts runs this
          # very script with a stand-in docker.
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="ghcr.io/$owner/colloq-kernel"
          # One `# colloq: <key> <value>` directive of a list, read the way
          # the entry point and the panel read it.
          directive() {
            sed -nE "s/^[[:space:]]*#[[:space:]]*colloq:[[:space:]]*$1[[:space:]]+([^[:space:]]+)[[:space:]]*\$/\\1/p" \
              "kernel/environments/$2.txt" | head -1
          }
          # Parents first: a child is built on the image published for its parent.
          order=()
          add() {
            local parent
            case " ${order[*]:-} " in *" $1 "*) return 0 ;; esac
            if [ ! -f "kernel/environments/$1.txt" ]; then
              echo "::error::no kernel/environments/$1.txt"; exit 1
            fi
            if grep -qE '^[[:space:]]*#[[:space:]]*colloq:[[:space:]]*gpu[[:space:]]*$' "kernel/environments/$1.txt"; then
              echo "::error::$1 is a GPU environment; this job publishes CPU environments only"; exit 1
            fi
            parent="$(directive from "$1")"
            if [ -n "$parent" ]; then add "$parent"; fi
            order+=("$1")
          }
          for name in $ENVIRONMENTS; do add "$name"; done
          # Run once in the runner's docker before anything is pushed:
          # kaggle-base by the check kernel/locks records (three boosters and
          # the rest, no network), the others by the imports every kernel needs.
          check() {
            if [ "$1" = kaggle-base ]; then
              docker run --rm --network none --read-only --tmpfs /tmp:rw,size=512m --user 1000:1000 \
                --cpus 2 --memory 4g -e HOME=/tmp -e MPLCONFIGDIR=/tmp/mpl -e NUMBA_CACHE_DIR=/tmp/numba \
                -v "$PWD/scripts/check-kaggle-base.py:/check.py:ro" "colloq-kernel:$1" python /check.py
            else
              docker run --rm --network none "colloq-kernel:$1" \
                python -c 'import jupyter_server, ipykernel, numpy, pandas, matplotlib, plotly, sklearn, black'
            fi
          }
          # The digest of every image published or found, for its children.
          digests="$RUNNER_TEMP/kernel-digests"
          mkdir -p "$digests"
          for name in "${order[@]}"; do
            ref="$repo:v$VERSION-$name"
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "::notice::$ref is already published; not rebuilding it."
              docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' > "$digests/$name"
              continue
            fi
            args=(--platform linux/amd64 -f kernel/Dockerfile --build-arg "KERNEL_ENV=$name"
              --label "org.opencontainers.image.title=colloq-kernel"
              --label "org.opencontainers.image.description=Colloq room kernel: the $name environment"
              --label "org.opencontainers.image.version=$VERSION"
              --label "org.opencontainers.image.revision=$COMMIT"
              --label "org.opencontainers.image.source=$SOURCE_URL"
              --label "org.opencontainers.image.licenses=MIT"
              --label "colloq.environment=$name")
            parent="$(directive from "$name")"
            if [ -n "$parent" ]; then
              args+=(--build-arg "PARENT=$repo@$(cat "$digests/$parent")")
            else
              python="$(directive python "$name")"
              if [ -n "$python" ]; then args+=(--build-arg "PARENT=python:$python-slim-bookworm"); fi
            fi
            # Into the runner's docker for the check; attestations belong to the
            # pushed image, and the local image store may not take them.
            docker buildx build "${args[@]}" --provenance=false --load -t "colloq-kernel:$name" kernel
            check "$name"
            # The second build is the first one from the builder's cache, pushed.
            docker buildx build "${args[@]}" --push --provenance=mode=max --sbom=true \
              --metadata-file "$RUNNER_TEMP/$name.json" -t "$ref" kernel
            jq -r '."containerimage.digest"' "$RUNNER_TEMP/$name.json" > "$digests/$name"
            echo "::notice::published $ref ($(cat "$digests/$name"))"
          done
      - name: Pinned references for the chart
        id: pinned
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          # The files the step above wrote, one per environment it published
          # or found, as one line of JSON: environment -> repository@digest.
          images="$(cd "$RUNNER_TEMP/kernel-digests" && for name in *; do
            jq -n --arg name "$name" --arg ref "ghcr.io/$owner/colloq-kernel@$(cat "$name")" '{($name): $ref}'
          done | jq -cs add)"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # The two images the Helm chart runs (deploy/helm/colloq): the app, and the
  # broker that creates a Pod per room and per competition job through the
  # namespaced Kubernetes API. Both are targets of the root Dockerfile and share
  # its build stage, so one job builds both on one builder, and the second build
  # is mostly the first one's cache. Both stand on one node base, resolved to a
  # digest once, as scripts/release-build.py does: two builds minutes apart
  # could otherwise stand on two different node:22 images. The digests leave
  # the job as outputs, and the chart job writes exactly those. No :latest,
  # unlike colloq-vast: the chart installs by digest, and a cluster policy that
  # refuses :latest is the usual case in a bank, not the exception.
  app-images:
    name: App and broker images to GHCR
    needs: build
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.pinned.outputs.app }}
      runtime: ${{ steps.pinned.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Skip what is already published
        id: published
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Plain bash: tests/k8s-release.test.mts runs this script with a stand-in docker.
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "app=ghcr.io/$owner/colloq-app"
            echo "runtime=ghcr.io/$owner/colloq-runtime"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          for kind in app runtime; do
            ref="ghcr.io/$owner/colloq-$kind:v$VERSION"
            # A published tag is never rebuilt, so what it names is what the
            # first run pushed, and that is the digest the chart gets.
            if digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              echo "::notice::$ref is already published; not rebuilding it."
              echo "${kind}_digest=$digest" >> "$GITHUB_OUTPUT"
            fi
          done
          # The Dockerfile's own default, not a second copy of its name.
          base="$(sed -nE 's/^ARG NODE_IMAGE=([^[:space:]]+)$/\1/p' Dockerfile | head -1)"
          if [ -z "$base" ]; then
            echo "::error::the Dockerfile names no NODE_IMAGE default"; exit 1
          fi
          case "$base" in
            *@sha256:*) node="$base" ;;
            *) node="$base@$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')" ;;
          esac
          echo "node=$node" >> "$GITHUB_OUTPUT"
      # The OCI labels are given here: the root Dockerfile, unlike
      # deploy/vast/Dockerfile, writes none. The revision is the tag's commit.
      - name: Build and push colloq-app
        id: app
        if: steps.published.outputs.app_digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.published.outputs.app }}:${{ steps.published.outputs.tag }}
          build-args: |
            NODE_IMAGE=${{ steps.published.outputs.node }}
          labels: |
            org.opencontainers.image.title=colloq-app
            org.opencontainers.image.description=Colloq app for Kubernetes: the server the Helm chart deploy/helm/colloq runs next to colloq-runtime
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ needs.build.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push colloq-runtime
        id: runtime
        if: steps.published.outputs.runtime_digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          target: broker
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.published.outputs.runtime }}:${{ steps.published.outputs.tag }}
          build-args: |
            NODE_IMAGE=${{ steps.published.outputs.node }}
          labels: |
            org.opencontainers.image.title=colloq-runtime
            org.opencontainers.image.description=Colloq runtime broker: creates a Pod and a Service per room and per competition job through the namespaced Kubernetes API
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ needs.build.outputs.commit }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
      - name: Pinned references for the chart
        id: pinned
        env:
          APP: ${{ steps.published.outputs.app }}
          RUNTIME: ${{ steps.published.outputs.runtime }}
          APP_DIGEST: ${{ steps.published.outputs.app_digest || steps.app.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.published.outputs.runtime_digest || steps.runtime.outputs.digest }}
        run: |
          set -euo pipefail
          for digest in "$APP_DIGEST" "$RUNTIME_DIGEST"; do
            if ! [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::an image of this release came out without a digest ($digest)"; exit 1
            fi
          done
          echo "app=$APP@$APP_DIGEST" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME@$RUNTIME_DIGEST" >> "$GITHUB_OUTPUT"
          echo "::notice::$APP@$APP_DIGEST and $RUNTIME@$RUNTIME_DIGEST"

  # The Helm chart a university's platform team installs into its own cluster
  # (deploy/helm/colloq; docs/pages/en/kubernetes.html). Its defaults are this
  # release: scripts/chart-values.py writes the digests app-images and kernels
  # handed over and the kernel catalog into values.yaml (the catalog by the code
  # that writes release.json's, scripts/release-build.py), and the version into
  # Chart.yaml. The package goes to oci://ghcr.io/<owner>/charts/colloq and to
  # the GitHub Release, next to values-X.Y.Z.yaml, the same values on their
  # own. A chart version in the registry is never pushed twice: a rerun attaches
  # the package it pulls from there, so the registry and the release carry one file.
  chart:
    name: Helm chart to GHCR and the release
    needs: [build, app-images, kernels]
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      # Pinned by checksum here, not by the sums file next to the download:
      # this job holds a token that writes packages and the release.
      HELM_VERSION: v3.19.0
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Install helm
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/helm.tar.gz"
          curl --fail --silent --show-error --location "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz" --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$archive" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/helm/helm" version
      - name: Write the release into the chart
        env:
          VERSION: ${{ needs.build.outputs.version }}
          APP_IMAGE: ${{ needs.app-images.outputs.app }}
          RUNTIME_IMAGE: ${{ needs.app-images.outputs.runtime }}
          KERNEL_IMAGES: ${{ needs.kernels.outputs.images }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/helm/colloq/Chart.yaml ]; then
            echo "::error::deploy/helm/colloq is missing at this tag; there is no chart to publish"
            exit 1
          fi
          mkdir -p out
          python3 scripts/chart-values.py --version "$VERSION" --app-image "$APP_IMAGE" --runtime-image "$RUNTIME_IMAGE" \
            --kernel-images "$KERNEL_IMAGES" --default-environment base \
            --chart deploy/helm/colloq --output "out/values-$VERSION.yaml"
          git diff --stat -- deploy/helm/colloq
          helm lint deploy/helm/colloq
          helm package deploy/helm/colloq --destination out
          package="out/colloq-$VERSION.tgz"
          # What goes out is checked in the package itself: its version, and
          # every digest of this release in what its defaults render (with the
          # ingress off: its host is the one value no default can give).
          test "$(helm show chart "$package" | sed -n 's/^version: //p')" = "$VERSION"
          rendered="$(helm template colloq "$package" --namespace colloq --set ingress.enabled=false)"
          for ref in "$APP_IMAGE" "$RUNTIME_IMAGE" $(jq -r '.[]' <<<"$KERNEL_IMAGES"); do
            if ! grep -qF "${ref#*@}" <<<"$rendered"; then
              echo "::error::the packaged chart does not install $ref"; exit 1
            fi
          done
      - name: Refuse a tag without a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # Checked before the push, not after: a chart version in the registry
          # cannot be taken back, and without a release it has nowhere to be
          # attached. Releases belong to release-please, as in github-release.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md."
            exit 1
          fi
      - name: Push the chart unless this version is published
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          charts="oci://ghcr.io/$owner/charts"
          # The login comes after the chart was written and checked: no step
          # that runs code from the repository has the credentials on disk.
          printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          if helm show chart "$charts/colloq" --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice::$charts/colloq:$VERSION is already published; attaching that package, not this build."
            rm "out/colloq-$VERSION.tgz"
            helm pull "$charts/colloq" --version "$VERSION" --destination out
          else
            helm push "out/colloq-$VERSION.tgz" "$charts"
          fi
      - name: Attach the chart to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          upload=()
          for file in "out/colloq-$VERSION.tgz" "out/values-$VERSION.yaml"; do
            grep -qxF "$(basename "$file")" <<<"$assets" || upload+=("$file")
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "::notice::$TAG already carries the chart and its values; they stay the files of record."
            exit 0
          fi
          # No --clobber, as with the wheels: a file of the same name stays.
          gh release upload "$TAG" "${upload[@]}"
