# Publishes the vX.Y.Z release that release-please has already created. There
# is one entry point, workflow_dispatch with a tag, and two parties start it:
# release-please.yml right after the release (the usual path: the release PR
# was merged, and everything goes by itself) and a person, when missing parts
# have to be delivered for an existing tag.
#
# There is deliberately no `push: tags` trigger. release-please creates the
# tag with the owner's personal token, and such a tag does start workflows:
# with that trigger the release would be published twice, with two PyPI
# approval requests. Only one path is left.
#
#   build           tag = package.json = CHANGELOG (scripts/version.mts check),
#                   typecheck, the whole suite, and the pip wheels: the
#                   universal one and four platform wheels with Node inside
#                   (scripts/platform-wheels.py);
#   smoke           every platform wheel is installed into a clean venv and
#                   run on its own OS; if one does not run, there is no release;
#   github-release  the wheels and python-SHA256SUMS, attached to the release
#                   release-please created. The release itself is not created
#                   here: release-please writes its notes from the release PR,
#                   and a second writer would drift from it;
#   pypi            the wheels to PyPI, only when vars.PUBLISH_PYPI == 'true';
#   image           the vast.ai image to GHCR, only when vars.PUBLISH_IMAGES == 'true'.
#
# PyPI and GHCR are off until the owner turns them on with repository
# variables: nothing can be re-uploaded there, and the first release must not
# accidentally take the package name or the image tag. Steps and setup:
# RELEASING.md.
#
# The immutable release for k3s (release.json with the image digests) is the
# separate manual release.yml: it needs a verified k3s version and versions of
# the GPU plumbing that cannot be derived from the tag. It adds its files to
# the same GitHub Release.
#
# workflow_dispatch with a tag is a rerun for missing parts: for example,
# PUBLISH_PYPI was turned on after the release. What is already published is
# not overwritten: the wheel taken is the one attached to the release, and an
# existing image tag is skipped. Run it from the tag itself ("Use workflow
# from: vX.Y.Z"): see the verification step in build.
#
# Not workflow_call: called from release-please.yml, this file carried
# workflow_ref = release-please.yml in its OIDC token, and PyPI Trusted
# Publishing does not support reusable workflows. A standalone run from the
# tag keeps the way to it open, even while uploads go by token.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag vX.Y.Z to publish the missing parts of
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          # The token does not stay in .git/config during `npm ci` and the
          # tests: from here on git only reads the local history.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Tag, package.json and changelog agree
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The check comes before the tag is written anywhere: once it has
          # passed, the tag is guaranteed to look like vX.Y.Z[-rc.N] and is
          # safe in outputs.
          node --import tsx scripts/version.mts check --tag "$TAG"
          # The tag is on the commit under check, not a branch of that name.
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          # A tag is published by the workflow that lies in the tag itself. A
          # rerun from the tag ("Use workflow from: vX.Y.Z") guarantees that on
          # its own. The call from release-please.yml comes from main: this
          # file is taken from $GITHUB_SHA (for a called workflow that is the
          # caller's commit), and release-please puts the tag on the merge
          # commit of the release PR, usually the very same one. If in the
          # queue of runs the tag went to another commit of main, that one
          # will do too, as long as their .github is the same: the workflow is
          # then the same. Otherwise, as with a manual run from a branch, it
          # refuses: a different workflow would be doing the publishing.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" HEAD -- .github; then
              echo "::error::The workflows at $TAG differ from the ones running now. Run this workflow from the tag: gh workflow run publish.yml --ref $TAG -f tag=$TAG"
              exit 1
            fi
          fi
          version="$(node --import tsx scripts/version.mts current)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - name: Build the wheel (make wheel)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make wheel
      - name: The installed wheel names the tagged version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet python/dist/*.whl
          got="$(COLLOQ_HOME="$RUNNER_TEMP/colloq-home" NO_COLOR=1 "$RUNNER_TEMP/venv/bin/colloq" --version)"
          test "$got" = "$VERSION"
          git diff --exit-code
      # The Node archives are pinned by sha256 in scripts/node-runtime.json.
      # The cache only saves the download; the check runs regardless.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/colloq/node
          key: node-runtime-${{ hashFiles('scripts/node-runtime.json') }}
      - name: Platform wheels with Node inside
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 scripts/platform-wheels.py build
      - name: The Linux x64 wheel runs here without a Node of its own
        run: python3 scripts/platform-wheels.py smoke --wheel python/dist/*-manylinux_2_28_x86_64.whl
      - name: Release files
        run: |
          set -euo pipefail
          mkdir -p out
          cp python/dist/*.whl out/
          (cd out && sha256sum -- *.whl > python-SHA256SUMS)
          cat out/python-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  # A platform wheel that does not run on its own OS never reaches PyPI: a
  # version there cannot be replaced, only yanked. Linux x64 is already run in
  # build; here are the other three targets, each on its own runner.
  smoke:
    name: Platform wheel on ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15, tag: macosx_14_0_arm64 }
          - { target: darwin-x64, os: macos-15-intel, tag: macosx_14_0_x86_64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, tag: manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Install and run the wheel
        run: python3 scripts/platform-wheels.py smoke --wheel out/*-${{ matrix.tag }}.whl

  github-release:
    name: Attach the wheels to the GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Add the wheels to the release release-please created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The release is created by release-please when the release PR is
          # merged, and its notes come from there too. If it is missing, the
          # tag was put past release-please; creating the release here would
          # mean a second writer of notes, so refuse.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md."
            exit 1
          fi
          # release-please marks a prerelease only with prerelease: true, and
          # that would mark every 0.x as one too. So -rc.N is marked here:
          # otherwise GitHub would show an rc as "Latest".
          if [ "$PRERELEASE" = true ] && [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]; then
            gh release edit "$TAG" --prerelease
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          upload=()
          for file in out/*.whl out/python-SHA256SUMS; do
            grep -qxF "$(basename "$file")" <<<"$assets" || upload+=("$file")
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "::notice::$TAG already carries every wheel; they stay the files of record."
            exit 0
          fi
          # No --clobber: a file with the same name (for example, from
          # release.yml) is not overwritten; the upload fails instead.
          gh release upload "$TAG" "${upload[@]}"

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    # The PyPI API token is a secret of the `pypi` environment, not of the
    # repository: only this job sees it, and only after approval. An
    # environment with a required reviewer is the last button before what can
    # no longer be taken back. Trusted Publishing is postponed: it refused
    # v0.2.0 with `invalid-publisher`, and the first version was uploaded by
    # hand with this same token.
    environment:
      name: pypi
      url: https://pypi.org/project/colloq/
    permissions:
      contents: read
    steps:
      # The wheel is the one attached to the release, not a rebuilt one: PyPI
      # and the release page must carry the very same file.
      - name: Take the wheel attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.whl' --pattern python-SHA256SUMS --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c python-SHA256SUMS)
          # sha256sum -c says nothing about files missing from the list, so
          # every wheel has to be listed.
          for wheel in "$RUNNER_TEMP/release/"*.whl; do
            if ! grep -q "  $(basename "$wheel")\$" "$RUNNER_TEMP/release/python-SHA256SUMS"; then
              echo "::error::$(basename "$wheel") is not listed in python-SHA256SUMS"
              exit 1
            fi
          done
          mkdir -p dist
          cp "$RUNNER_TEMP/release/"*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A version on PyPI cannot be re-uploaded; a rerun simply skips it.
          skip-existing: true
          print-hash: true

  image:
    name: vast.ai image to GHCR
    needs: build
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/vast/Dockerfile ]; then
            echo "::error::deploy/vast/Dockerfile is missing at this tag; nothing to publish"
            exit 1
          fi
          name="ghcr.io/${OWNER,,}/colloq-vast"
          tags="$name:$VERSION"
          # latest only for a release: an rc must not reach whoever put
          # "latest" into their vast template.
          if [ "$PRERELEASE" != true ]; then tags="$tags,$name:latest"; fi
          { echo "name=$name"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Skip a version that is already published
        id: exists
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$NAME:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$NAME:$VERSION is already published; not rebuilding it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The OCI labels (version, revision, source, licenses) are written by
      # deploy/vast/Dockerfile itself from these arguments; they are not
      # duplicated here, so the image does not get two descriptions. The
      # revision is the tag's commit, not github.sha: on a manual rerun that
      # one points at the branch.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          file: deploy/vast/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            COLLOQ_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ needs.build.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
