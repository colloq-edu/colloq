# Публикация выпуска vX.Y.Z, который уже создал release-please. Вход один —
# workflow_dispatch с тегом, и запускают его двое: release-please.yml сразу
# после выпуска (обычный путь: слили PR выпуска, и всё едет само) и человек,
# когда нужно дослать недостающие части для существующего тега.
#
# Триггера `push: tags` нет нарочно. release-please создаёт тег личным токеном
# владельца, а такой тег запускает workflow: с этим триггером выпуск
# публиковался бы дважды, с двумя запросами одобрения PyPI. Путь оставлен один.
#
#   build           tag = package.json = CHANGELOG (scripts/version.mts check),
#                   typecheck, the whole suite, and the pip wheels: the
#                   universal one and four platform wheels with Node inside
#                   (scripts/platform-wheels.py);
#   smoke           every platform wheel is installed into a clean venv and
#                   run on its own OS; if one does not run, there is no release;
#   github-release  the wheels and python-SHA256SUMS, attached to the release
#                   release-please created. The release itself is not created
#                   here: release-please writes its notes from the release PR,
#                   and a second writer would drift from it;
#   pypi            the wheels to PyPI, only when vars.PUBLISH_PYPI == 'true';
#   image           the vast.ai image to GHCR, only when vars.PUBLISH_IMAGES == 'true'.
#
# PyPI и GHCR выключены, пока владелец не включит их переменными репозитория:
# туда ничего нельзя перезалить, и первый выпуск не должен случайно занять имя
# пакета или тег образа. Шаги и настройка — RELEASING.md.
#
# Неизменяемый выпуск для k3s (release.json с digest-ами образов) — отдельный
# ручной release.yml: ему нужны проверенная версия k3s и версии GPU-обвязки,
# которые из тега не вывести. Он дописывает свои файлы в тот же GitHub Release.
#
# workflow_dispatch с тегом — перезапуск для недостающих частей: например,
# включили PUBLISH_PYPI после выпуска. Уже опубликованное не перезаписывается —
# колесо берётся то, что приложено к выпуску, а существующий тег образа
# пропускается. Запускать его — с самого тега («Use workflow from: vX.Y.Z»):
# см. шаг сверки в build.
#
# Не workflow_call: вызванный из release-please.yml, этот файл нёс в
# OIDC-токене workflow_ref = release-please.yml, а переиспользуемые workflow
# Trusted Publishing PyPI не поддерживает. Самостоятельный прогон с тега
# оставляет дорогу к нему открытой, даже пока выкладка идёт по токену.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag vX.Y.Z to publish the missing parts of
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          # Токен не остаётся в .git/config на время `npm ci` и тестов: дальше
          # git только читает локальную историю.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Tag, package.json and changelog agree
        id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Сверка — до того, как тег куда-либо запишется: пройдя её, он
          # гарантированно имеет вид vX.Y.Z[-rc.N] и безопасен в выводах.
          node --import tsx scripts/version.mts check --tag "$TAG"
          # Тег — на проверяемом коммите, а не ветка с тем же именем.
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          # Публикует тег тот workflow, что лежит в самом теге. Перезапуск с
          # тега («Use workflow from: vX.Y.Z») это гарантирует сам. Вызов из
          # release-please.yml идёт с main: этот файл взят из $GITHUB_SHA
          # (у вызванного workflow это коммит вызвавшего), а release-please
          # ставит тег на коммит слияния PR выпуска — обычно тот же самый.
          # Если в очереди прогонов тег достался другому коммиту main, годится
          # и он, пока .github у них одинаковый: workflow тогда тот же. Иначе,
          # как и ручной запуск с ветки, — отказ: публиковал бы чужой workflow.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" HEAD -- .github; then
              echo "::error::The workflows at $TAG differ from the ones running now. Run this workflow from the tag: gh workflow run publish.yml --ref $TAG -f tag=$TAG"
              exit 1
            fi
          fi
          version="$(node --import tsx scripts/version.mts current)"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - name: Build the wheel (make wheel)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make wheel
      - name: The installed wheel names the tagged version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet python/dist/*.whl
          got="$(COLLOQ_HOME="$RUNNER_TEMP/colloq-home" NO_COLOR=1 "$RUNNER_TEMP/venv/bin/colloq" --version)"
          test "$got" = "$VERSION"
          git diff --exit-code
      # The Node archives are pinned by sha256 in scripts/node-runtime.json.
      # The cache only saves the download; the check runs regardless.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/colloq/node
          key: node-runtime-${{ hashFiles('scripts/node-runtime.json') }}
      - name: Platform wheels with Node inside
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 scripts/platform-wheels.py build
      - name: The Linux x64 wheel runs here without a Node of its own
        run: python3 scripts/platform-wheels.py smoke --wheel python/dist/*-manylinux_2_28_x86_64.whl
      - name: Release files
        run: |
          set -euo pipefail
          mkdir -p out
          cp python/dist/*.whl out/
          (cd out && sha256sum -- *.whl > python-SHA256SUMS)
          cat out/python-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: out/
          if-no-files-found: error

  # A platform wheel that does not run on its own OS never reaches PyPI: a
  # version there cannot be replaced, only yanked. Linux x64 is already run in
  # build; here are the other three targets, each on its own runner.
  smoke:
    name: Platform wheel on ${{ matrix.target }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15, tag: macosx_14_0_arm64 }
          - { target: darwin-x64, os: macos-15-intel, tag: macosx_14_0_x86_64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, tag: manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Install and run the wheel
        run: python3 scripts/platform-wheels.py smoke --wheel out/*-${{ matrix.tag }}.whl

  github-release:
    name: Attach the wheels to the GitHub Release
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: Add the wheels to the release release-please created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Выпуск создаёт release-please при слиянии PR выпуска, и заметки у
          # него оттуда же. Его нет — значит, тег поставлен мимо release-please;
          # создавать выпуск здесь — это второй писатель заметок, так что отказ.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub Release. Releases are created by release-please when its release pull request is merged; see RELEASING.md."
            exit 1
          fi
          # release-please помечает предвыпуском только при prerelease: true,
          # а оно пометило бы им и каждый 0.x. Поэтому -rc.N помечается здесь:
          # иначе GitHub показал бы rc как «Latest».
          if [ "$PRERELEASE" = true ] && [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != true ]; then
            gh release edit "$TAG" --prerelease
          fi
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          upload=()
          for file in out/*.whl out/python-SHA256SUMS; do
            grep -qxF "$(basename "$file")" <<<"$assets" || upload+=("$file")
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "::notice::$TAG already carries every wheel; they stay the files of record."
            exit 0
          fi
          # Без --clobber: файл с тем же именем (например, от release.yml) не
          # перепишется, а откажет.
          gh release upload "$TAG" "${upload[@]}"

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-24.04
    # API-токен PyPI — секрет окружения `pypi`, а не репозитория: его видит
    # только эта задача и только после одобрения. Окружение с обязательным
    # ревьюером — последняя кнопка перед тем, что уже нельзя отозвать.
    # Trusted Publishing отложен: v0.2.0 он отказал `invalid-publisher`, и
    # первую версию выложили этим же токеном вручную.
    environment:
      name: pypi
      url: https://pypi.org/project/colloq/
    permissions:
      contents: read
    steps:
      # Колесо — то, что приложено к выпуску, а не пересобранное: на PyPI и на
      # странице выпуска должен лежать один и тот же файл.
      - name: Take the wheel attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.whl' --pattern python-SHA256SUMS --dir "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c python-SHA256SUMS)
          # sha256sum -c says nothing about files missing from the list, so
          # every wheel has to be listed.
          for wheel in "$RUNNER_TEMP/release/"*.whl; do
            if ! grep -q "  $(basename "$wheel")\$" "$RUNNER_TEMP/release/python-SHA256SUMS"; then
              echo "::error::$(basename "$wheel") is not listed in python-SHA256SUMS"
              exit 1
            fi
          done
          mkdir -p dist
          cp "$RUNNER_TEMP/release/"*.whl dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Версию на PyPI не перезалить; повторный запуск просто её пропускает.
          skip-existing: true
          print-hash: true

  image:
    name: vast.ai image to GHCR
    needs: build
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/vast/Dockerfile ]; then
            echo "::error::deploy/vast/Dockerfile is missing at this tag; nothing to publish"
            exit 1
          fi
          name="ghcr.io/${OWNER,,}/colloq-vast"
          tags="$name:$VERSION"
          # latest — только у выпуска: rc не должен доставаться тому, кто
          # вписал в шаблон vast «последний».
          if [ "$PRERELEASE" != true ]; then tags="$tags,$name:latest"; fi
          { echo "name=$name"; echo "tags=$tags"; } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Skip a version that is already published
        id: exists
        env:
          NAME: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$NAME:$VERSION" >/dev/null 2>&1; then
            echo "::notice::$NAME:$VERSION is already published; not rebuilding it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # OCI-метки (version, revision, source, licenses) пишет сам
      # deploy/vast/Dockerfile из этих аргументов — здесь их не дублируем,
      # чтобы у образа не было двух описаний. Ревизия — коммит тега, а не
      # github.sha: при ручном перезапуске тот указывает на ветку.
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.skip != 'true'
        with:
          context: .
          file: deploy/vast/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            COLLOQ_VERSION=${{ needs.build.outputs.version }}
            GIT_SHA=${{ needs.build.outputs.commit }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
