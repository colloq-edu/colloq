# Checks every pull request and every push to main.
#
# Before this file nobody checked the tree: tests and typecheck ran only inside
# the manual release.yml, that is, for the first time on release day, when the
# tag is already in origin. Here are the same checks the release runs
# (publish.yml), only nothing is published: permissions are read-only, there
# are no secrets, so the workflow is safe to run on PRs from forks too.
#
# Three jobs in parallel, because they are about different things and fail for
# different reasons:
#   test     — the versions agree, types, the whole `npm test` suite;
#   package  — the pip wheel builds, installs into a clean venv and names the
#              same version, and the build does not dirty tracked files;
#   docker   — the Dockerfiles of the app, the broker, the base kernel and the
#              vast.ai image (deploy/vast) build without push. Otherwise a
#              breakage in the first three would be found only by release.yml,
#              and in the vast image only by a release with PUBLISH_IMAGES,
#              that is, after the tag.
#
# The suite does NOT need a Docker daemon: tests that need docker put their
# own fake binary into PATH (see tests/README.md), and python3 is present on
# the ubuntu runner. If this ever changes, it will fail here, not at release.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# persist-credentials: false on every checkout: otherwise the token sits in
# .git/config the whole time `npm ci` runs other people's install scripts and
# `npm test` runs code from the PR. The token here is read-only, but git does
# not go to the network after checkout, and there is no reason to keep it on
# disk.

# A new push to the same branch cancels the previous run: nobody needs the
# result for the old commit any more. In main too: there the latest commit is
# what matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The cheapest first: the version copies, the release-please manifest,
      # the changelog and a trial release-please edit, so a new workspace
      # without a line in extra-files fails here, not in the release PR. On
      # the release PR itself (the owner's personal token opens it, so CI does
      # run on it) this checks the bump that PR made.
      - name: Version copies agree
        run: node --import tsx scripts/version.mts check
      - run: npm run typecheck
      - run: npm test

  package:
    name: Build the pip wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Build the wheel (make wheel)
        run: |
          # Build date = commit date: two runs of one commit give the same wheel.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make wheel
      - name: The installed wheel names the package.json version
        run: |
          want="$(node --import tsx scripts/version.mts current)"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet python/dist/*.whl
          # --version answers without npm install (python/colloq/__main__.py · TELLING).
          got="$(COLLOQ_HOME="$RUNNER_TEMP/colloq-home" NO_COLOR=1 "$RUNNER_TEMP/venv/bin/colloq" --version)"
          echo "package.json: $want · colloq --version: $got"
          test "$got" = "$want"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/colloq/node
          key: node-runtime-${{ hashFiles('scripts/node-runtime.json') }}
      # Platform wheels: Node and node_modules inside. All four are built here;
      # Linux x64 also runs here, the other three in wheel-smoke.
      - name: Platform wheels with Node inside
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 scripts/platform-wheels.py build
      - name: The Linux x64 wheel runs here without a Node of its own
        run: python3 scripts/platform-wheels.py smoke --wheel python/dist/*-manylinux_2_28_x86_64.whl
      - name: Python sources compile
        run: python3 -m py_compile python/colloq/*.py scripts/*.py
      # The build rewrites two tracked files: _version.py and the pdf.js
      # worker. If they diverged from what is in the tree, the release would
      # make the commit "dirty" after the tag.
      - name: Building leaves tracked files unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: python/dist/*.whl
          retention-days: 7
          if-no-files-found: error

  wheel-smoke:
    name: Platform wheel on ${{ matrix.target }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15, tag: macosx_14_0_arm64 }
          - { target: darwin-x64, os: macos-15-intel, tag: macosx_14_0_x86_64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, tag: manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Install and run the wheel
        run: python3 scripts/platform-wheels.py smoke --wheel dist/*-${{ matrix.tag }}.whl

  docker:
    name: Build Docker images (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: App (production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Runtime broker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: broker
          push: false
          cache-from: type=gha,scope=app
      - name: Base kernel environment
        uses: docker/build-push-action@v6
        with:
          context: kernel
          build-args: KERNEL_ENV=base
          push: false
          cache-from: type=gha,scope=kernel
          cache-to: type=gha,mode=max,scope=kernel
      # The same platform as in publish.yml: vast machines are amd64.
      - name: vast.ai image (deploy/vast)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/vast/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=vast
          cache-to: type=gha,mode=max,scope=vast
